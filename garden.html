<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden</title>
<style>
  /* v8: the Vault (a dark link-graveyard) became the Garden — warm, light,
     living. Same layout bones; opposite mood. Palette: cream + garden green. */
  :root {
    --bg: #FAF6EF;
    --surface: #FFFFFF;
    --ink: #2E3A2F;
    --ink-muted: #7A8073;
    --accent: #4A7C59;
    --accent-soft: rgba(74, 124, 89, 0.10);
    --border: #E4DCCB;
    --radius: 10px;
    /* Type system (design pass 3.5, #25): native system stack, no webfonts. */
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 84px 40px 56px;
  }

  h1 {
    font-family: var(--sans);
    font-size: clamp(1.8rem, 4vw, 2.1rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.08;
    margin-bottom: 4px;
    color: var(--accent);
  }

  .subtitle {
    color: var(--ink-muted);
    font-size: 0.85rem;
    margin-bottom: 32px;
  }

  .wrap { width: 100%; max-width: 640px; }

  /* Weekly harvest (filled by the Monday digest; hidden until then). */
  .harvest {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 28px;
    font-size: 0.9rem;
    line-height: 1.55;
  }
  .harvest h2 {
    font-family: var(--sans);
    font-weight: 650;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .harvest p { margin: 6px 0; }
  .harvest a { color: var(--accent); }
  .harvest .past { margin-top: 12px; font-size: 0.8rem; color: var(--ink-muted); }
  .harvest .merge-row { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .harvest button {
    font-family: inherit; font-size: 0.76rem; cursor: pointer;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }
  .harvest button:hover { background: var(--accent); color: #fff; }

  .search-box { width: 100%; position: relative; margin-bottom: 16px; }

  .search-box input {
    width: 100%;
    padding: 16px 20px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: inherit;
    font-size: 1.05rem;
    background: var(--surface);
    color: var(--ink);
    transition: border-color 0.15s;
  }

  .search-box input:focus { outline: none; border-color: var(--accent); }
  .search-box input::placeholder { color: #B5B0A3; }

  /* Theme chips — inventory, never guilt; click to filter. */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    font-size: 0.78rem; cursor: pointer; user-select: none;
    background: var(--surface); color: var(--ink-muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
    transition: all 0.1s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip .n { opacity: 0.6; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .count {
    color: var(--ink-muted);
    font-size: 0.78rem;
    margin-bottom: 20px;
    width: 100%;
  }

  .results { width: 100%; display: flex; flex-direction: column; gap: 6px; }

  .garden-item {
    padding: 14px 18px;
    border-radius: 10px;
    transition: background 0.1s, box-shadow 0.1s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .garden-item:hover {
    background: var(--surface);
    box-shadow: 0 1px 4px rgba(46, 58, 47, 0.06);
  }
  .garden-item-content { flex: 1; min-width: 0; }

  .garden-item-title {
    font-size: 0.92rem;
    color: var(--accent);
    text-decoration: none;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }
  .garden-item-title:hover { text-decoration: underline; }

  /* The user's memo — his ANGLE. Primary: it leads, styled as the voice. */
  .garden-item-memo {
    font-size: 0.86rem;
    color: var(--ink);
    margin-top: 5px;
    line-height: 1.5;
    border-left: 2px solid var(--border);
    padding-left: 10px;
    font-style: italic;
  }
  .garden-item-kp {
    font-size: 0.82rem;
    color: var(--ink);
    margin-top: 6px;
    line-height: 1.45;
    font-weight: 500;
  }
  .garden-item-summary {
    font-size: 0.8rem;
    color: var(--ink-muted);
    margin-top: 4px;
    line-height: 1.5;
  }
  .garden-item-tags { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
  .garden-item-imgs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .garden-item-imgs img { height: 88px; width: auto; max-width: 140px; object-fit: cover;
    border: 1px solid var(--border); border-radius: 6px; }
  .tag {
    font-size: 0.68rem; color: var(--ink-muted);
    background: var(--accent-soft); border-radius: 999px; padding: 2px 8px;
  }
  .garden-item-meta {
    margin-top: 7px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    font-size: 0.72rem; color: #9A9488;
  }
  .theme-tag { color: var(--accent); font-weight: 500; }
  .badge-dead {
    font-size: 0.68rem; color: #9A8F7A;
    background: #F0EADD; border-radius: 999px; padding: 2px 8px;
  }
  .garden-item-url {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 60%;
  }
  .garden-item-url a { color: #9A9488; text-decoration: none; }
  .garden-item-url a:hover { text-decoration: underline; }

  .garden-item-tools {
    display: flex; gap: 4px; flex-shrink: 0; margin-top: 2px;
    opacity: 0; transition: opacity 0.1s;
  }
  .garden-item:hover .garden-item-tools,
  .garden-item:focus-within .garden-item-tools { opacity: 1; }
  .garden-item-edit, .garden-item-delete {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--ink-muted);
    width: 24px; height: 24px;
    cursor: pointer; font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.1s;
  }
  .garden-item-edit:hover { border-color: var(--accent); color: var(--accent); }
  .garden-item-delete:hover { border-color: #C0392B; color: #C0392B; }

  .garden-item-editing { display: block; background: var(--surface); box-shadow: 0 1px 4px rgba(46,58,47,0.06); }
  .garden-edit { display: flex; flex-direction: column; gap: 4px; }
  .garden-edit label { font-size: 0.72rem; color: var(--ink-muted); margin-top: 6px; }
  .garden-edit textarea, .garden-edit input {
    font: inherit; font-size: 0.88rem; padding: 8px 10px; resize: vertical;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  .garden-edit textarea:focus, .garden-edit input:focus { outline: none; border-color: var(--accent); }
  .garden-edit-actions { display: flex; gap: 8px; margin-top: 10px; }
  .garden-edit-actions button {
    font: inherit; font-size: 0.82rem; cursor: pointer; border-radius: 8px; padding: 6px 14px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  .garden-edit-actions .g-save { background: var(--accent); color: #fff; border-color: var(--accent); }

  .empty { text-align: center; color: var(--ink-muted); padding: 60px 20px; font-size: 0.92rem; line-height: 1.6; }
  .no-results { text-align: center; color: var(--ink-muted); padding: 40px 20px; font-size: 0.88rem; }

  mark { background: rgba(74, 124, 89, 0.18); color: var(--ink); border-radius: 2px; padding: 0 1px; }

  .back-link { position: fixed; top: 24px; left: 24px; color: var(--ink-muted); text-decoration: none; font-size: 0.82rem; }
  .back-link:hover { color: var(--ink); }

  /* Connect gate (hosted mode only) — mirrors the dashboard's bar. The OAuth
     redirect_uri is registered for the DASHBOARD path, so the button sends the
     user there to connect; the token lives in same-origin localStorage, so the
     Garden picks it up on return. */
  .connect-gate {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    width: 100%; padding: 10px 14px; margin-bottom: 18px;
    background: var(--surface); border: 1px solid var(--border);
    border-left: 4px solid var(--accent); border-radius: var(--radius);
    font-size: 0.88rem; color: var(--ink);
  }
  .connect-gate .cg-btn {
    margin-left: auto; padding: 7px 14px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-family: inherit;
    font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none;
  }

  @media (max-width: 640px) {
    body { padding: 60px 16px 40px; }
    /* Hover-reveal is a no-op on touch — always show the edit/delete controls. */
    .garden-item-tools { opacity: 1; }
  }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
    max-width: 90vw; background: #2C3A30; color: #fff; padding: 11px 18px; border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); font-size: 0.9rem; z-index: 400;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    display: inline-flex; align-items: center; gap: 14px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast-action {
    background: transparent; border: 1px solid rgba(255,255,255,0.4); color: #fff; font: inherit;
    font-weight: 700; cursor: pointer; padding: 3px 12px; border-radius: 8px; flex: none;
  }
  .toast-action:hover { background: rgba(255,255,255,0.15); }
  .toast-action:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>

<div id="toast"></div>
<a class="back-link" href="/">&larr; Triage</a>

<h1>Garden</h1>
<p class="subtitle">Things worth keeping &mdash; digested, not buried.</p>

<div class="wrap">
  <div class="connect-gate" id="connect-gate" style="display:none">
    <span class="cg-msg">Not connected to Dropbox — your data lives in your Dropbox.</span>
    <a class="cg-btn" id="cg-btn" href="index.html">Connect on the dashboard</a>
  </div>

  <section class="harvest" id="harvest" hidden></section>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search by meaning — title, your note, summary, topics&hellip;" autofocus>
  </div>

  <div class="chips" id="chips"></div>

  <div class="count" id="count"></div>
  <div class="results" id="results"></div>
</div>

<script src="dbx.js"></script>
<script>
  const API = window.location.origin;
  let garden = [];
  let activeTheme = null;   // null = all themes

  // At home (localhost) → the local Python server, unchanged. Hosted (GitHub
  // Pages) → read Dropbox directly through dbx.js, exactly as the dashboard
  // does. Hosted is READ-ONLY v1: every write path below is LOCAL-gated.
  const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
  async function apiFetch(url, opts) {
    if (LOCAL) return fetch(url, opts);
    const path = url.replace(location.origin, '');   // '/api/…'
    if (typeof DBX === 'undefined') { renderConnectGate(); return { ok: false, status: 503, json: async () => ({}) }; }
    return DBX.handle(path, opts);                    // Response-compatible
  }

  // Hosted mode: a visible bar when Dropbox isn't connected yet, so an empty
  // Garden never reads as "nothing kept".
  async function renderConnectGate() {
    const bar = document.getElementById('connect-gate');
    if (!bar) return;
    const msg = bar.querySelector('.cg-msg'), btn = bar.querySelector('.cg-btn');
    if (LOCAL) { bar.style.display = 'none'; return; }
    if (typeof DBX === 'undefined') {
      msg.textContent = 'dbx.js failed to load — hard-refresh the page';
      btn.style.display = 'none';
      bar.style.display = 'flex';
      return;
    }
    try { if (DBX.ready) await DBX.ready; } catch (e) { /* ignore */ }
    if (DBX.connected()) { bar.style.display = 'none'; return; }
    msg.textContent = 'Not connected to Dropbox — your data lives in your Dropbox.';
    btn.style.display = '';
    bar.style.display = 'flex';
  }

  async function fetchGarden() {
    try {
      const res = await apiFetch(`${API}/api/garden`);
      const data = await res.json();
      garden = Array.isArray(data) ? data : [];   // an unmatched dbx route returns an error object — never poison the list
    } catch (e) {
      garden = [];
      renderConnectGate();
    }
    render();
  }

  // ── Undo toast ──────────────────────────────────────────────────────
  let _toastTimer = null, _undo = null;
  const UNDO_MS = 5000;
  function showToast(msg, opts) {
    const el = document.getElementById('toast');
    if (!el || !msg) return;
    el.textContent = '';
    const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
    if (opts && opts.onAction) {
      const btn = document.createElement('button');
      btn.className = 'toast-action'; btn.textContent = opts.actionLabel || 'Undo';
      btn.onclick = () => { el.classList.remove('show'); if (_toastTimer) clearTimeout(_toastTimer); opts.onAction(); };
      el.appendChild(btn);
    }
    el.classList.add('show');
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), (opts && opts.duration) || 4000);
  }
  function undoable(label, commit, restore) {
    commitPendingUndo();
    const u = { commit }; u.timer = setTimeout(commitPendingUndo, UNDO_MS); _undo = u;
    showToast(label, { actionLabel: 'Undo', duration: UNDO_MS, onAction: () => {
      if (_undo !== u) return; clearTimeout(u.timer); _undo = null; if (restore) restore();
    }});
  }
  function commitPendingUndo() {
    if (!_undo) return;
    const u = _undo; _undo = null; clearTimeout(u.timer);
    try { u.commit(); } catch (e) { /* fire-and-forget */ }
  }
  window.addEventListener('beforeunload', commitPendingUndo);

  // Delete a Garden item — its memo is the primary voice, so make it reversible:
  // optimistically hide the card, commit the server delete after the undo window.
  function deleteItem(id, ev) {
    const card = ev && ev.currentTarget ? ev.currentTarget.closest('.garden-item') : null;
    if (card) card.style.display = 'none';
    undoable('Removed from Garden',
      async () => {
        await fetch(`${API}/api/garden/delete`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        await fetchGarden();
      },
      () => { if (card) card.style.display = ''; });
  }

  // Must escape quotes too — escapeHtml feeds href="${…}" attributes here.
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // Never let a captured javascript:/data: URL become a live link.
  function safeUrl(url) {
    const u = (url || '').trim();
    if (!u) return '#';
    if (/^(https?:|mailto:)/i.test(u)) return u;
    if (/^[/#?]/.test(u)) return u;
    if (!/^[a-z][a-z0-9+.\-]*:/i.test(u)) return u;
    return '#';
  }

  function highlight(text, query) {
    if (!query || !text) return escapeHtml(text || '');
    const escaped = escapeHtml(text);
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    let result = escaped;
    for (const term of terms) {
      const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      result = result.replace(regex, '<mark>$1</mark>');
    }
    return result;
  }

  function truncateUrl(url) {
    try {
      const u = new URL(url);
      const path = u.pathname.length > 40 ? u.pathname.slice(0, 40) + '...' : u.pathname;
      return u.hostname + path;
    } catch { return url ? url.slice(0, 60) : ''; }
  }

  // Retrieval by MEANING, not archaeology: search title + memo + summary +
  // key_point + topics + url, and always keep the user's note (his angle) first.
  function haystack(item) {
    return [item.title, item.text, item.note, item.summary, item.key_point,
            (item.topics || []).join(' '), item.url]
      .filter(Boolean).join(' ').toLowerCase();
  }

  function headline(item) {
    return item.title || item.text || truncateUrl(item.url || '') || '(untitled)';
  }

  function renderChips() {
    const chipsEl = document.getElementById('chips');
    const counts = {};
    for (const it of garden) {
      if (it.theme) counts[it.theme] = (counts[it.theme] || 0) + 1;
    }
    const themes = Object.keys(counts).sort((a, b) => a.localeCompare(b));
    if (themes.length === 0) { chipsEl.innerHTML = ''; return; }   // suppress at zero
    const chip = (label, key, n) =>
      `<div class="chip${activeTheme === key ? ' active' : ''}" data-theme="${key == null ? '' : escapeHtml(key)}">`
      + `${escapeHtml(label)}<span class="n">${n}</span></div>`;
    let html = chip('All', null, garden.length);
    for (const t of themes) html += chip(t, t, counts[t]);
    chipsEl.innerHTML = html;
    chipsEl.querySelectorAll('.chip').forEach(el => {
      el.addEventListener('click', () => {
        const t = el.getAttribute('data-theme');
        activeTheme = t === '' ? null : t;
        render();
      });
    });
  }

  function render() {
    renderChips();
    const query = document.getElementById('search').value.trim();
    const countEl = document.getElementById('count');
    const resultsEl = document.getElementById('results');

    let filtered = garden;
    if (activeTheme) filtered = filtered.filter(it => it.theme === activeTheme);
    if (query) {
      const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
      filtered = filtered.filter(item => {
        const hay = haystack(item);
        return terms.every(t => hay.includes(t));
      });
    }

    filtered = filtered.slice().sort((a, b) => new Date(b.created) - new Date(a.created));

    const scope = activeTheme ? ` in “${escapeHtml(activeTheme)}”` : '';
    countEl.textContent = (query || activeTheme)
      ? `${filtered.length} of ${garden.length} items${scope}`
      : `${garden.length} items`;

    if (garden.length === 0) {
      resultsEl.innerHTML = '<div class="empty">Nothing in the garden yet.<br>Capture links with the Edge extension or a &ldquo;garden&rdquo; capture &mdash; they get digested here.</div>';
      return;
    }
    if (filtered.length === 0) {
      resultsEl.innerHTML = '<div class="no-results">No matches</div>';
      return;
    }

    resultsEl.innerHTML = filtered.map(item => {
      const head = headline(item);
      if (item.id === editingGardenId) {
        return `
          <div class="garden-item garden-item-editing">
            <div class="garden-edit">
              <label>Your note (your angle — leads the card)</label>
              <textarea id="g-note-${item.id}" rows="2">${escapeHtml(item.note || '')}</textarea>
              <label>Title</label>
              <input id="g-title-${item.id}" value="${escapeHtml(item.title || '')}" placeholder="Title">
              <label>Theme</label>
              <input id="g-theme-${item.id}" value="${escapeHtml(item.theme || '')}" placeholder="Theme (shelf label)">
              <div class="garden-edit-actions">
                <button class="g-save" onclick="saveGardenItem('${item.id}')">Save</button>
                <button class="g-cancel" onclick="cancelGardenEdit()">Cancel</button>
              </div>
            </div>
          </div>`;
      }
      const titleHtml = item.url
        ? `<a class="garden-item-title" href="${escapeHtml(safeUrl(item.url))}" target="_blank" rel="noopener">${highlight(head, query)}</a>`
        : `<div class="garden-item-title" style="cursor:default">${highlight(head, query)}</div>`;
      const memo = item.note ? `<div class="garden-item-memo">${highlight(item.note, query)}</div>` : '';
      const kp = item.key_point ? `<div class="garden-item-kp">${highlight(item.key_point, query)}</div>` : '';
      const summary = item.summary ? `<div class="garden-item-summary">${highlight(item.summary, query)}</div>` : '';
      const tags = (item.topics && item.topics.length)
        ? `<div class="garden-item-tags">${item.topics.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`
        : '';
      const metaBits = [];
      if (item.theme) metaBits.push(`<span class="theme-tag">${escapeHtml(item.theme)}</span>`);
      if (item.est_minutes) metaBits.push(`${item.est_minutes} min`);
      if (item.link_dead) metaBits.push('<span class="badge-dead" title="The server can\'t log in to read this (social post / paywall). Re-capture it with the browser extension to grab its caption and digest it.">🔒 couldn\'t read &mdash; re-capture in browser</span>');
      if (item.url) metaBits.push(`<span class="garden-item-url"><a href="${escapeHtml(safeUrl(item.url))}" target="_blank" rel="noopener">${highlight(truncateUrl(item.url), query)}</a></span>`);
      if (item.images && item.images.length) metaBits.unshift('<span title="Saved from a screenshot">📷</span>');
      const meta = metaBits.length ? `<div class="garden-item-meta">${metaBits.join('')}</div>` : '';
      // Screenshots are local files served by the Mac server — hosted has no
      // path to them (the 📷 meta marker still says the item came from one).
      const imgs = (LOCAL && item.images && item.images.length)
        ? `<div class="garden-item-imgs">${item.images.map(p => `<a href="${API}/${encodeURI(p)}" target="_blank" rel="noopener"><img src="${API}/${encodeURI(p)}" loading="lazy" alt="screenshot"></a>`).join('')}</div>`
        : '';
      // Hosted is read-only v1: edit / delete / promote all need the server.
      const tools = LOCAL ? `
          <div class="garden-item-tools">
            <button class="garden-item-edit" onclick="promoteGardenTask('${item.id}')" title="Make a task from this (the item stays)">→ task</button>
            <button class="garden-item-edit" onclick="editGardenItem('${item.id}')" title="Edit">✎</button>
            <button class="garden-item-delete" onclick="deleteItem('${item.id}', event)" title="Delete">✕</button>
          </div>` : '';
      return `
        <div class="garden-item">
          <div class="garden-item-content">
            ${titleHtml}
            ${memo}
            ${kp}
            ${summary}
            ${tags}
            ${imgs}
            ${meta}
          </div>${tools}
        </div>
      `;
    }).join('');
  }

  let editingGardenId = null;
  function editGardenItem(id) {
    editingGardenId = id;
    render();
    const t = document.getElementById(`g-note-${id}`);
    if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  }
  function cancelGardenEdit() { editingGardenId = null; render(); }
  async function saveGardenItem(id) {
    const note = document.getElementById(`g-note-${id}`);
    const title = document.getElementById(`g-title-${id}`);
    const theme = document.getElementById(`g-theme-${id}`);
    const fields = {};
    if (note) fields.note = note.value.trim();
    if (title) fields.title = title.value.trim();
    if (theme) fields.theme = theme.value.trim();
    editingGardenId = null;
    try {
      const res = await fetch(`${API}/api/garden/update`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, fields })
      });
      if (res.ok) { await fetchGarden(); showToast('Saved'); return; }
    } catch (e) { /* fall through */ }
    render();
    showToast('Couldn’t save');
  }

  // Phase E: the library-face → working-face graduation. Creates an Inbox task
  // FROM this item (knowledge that has become an action); the item STAYS.
  async function promoteGardenTask(id) {
    try {
      const res = await fetch(`${API}/api/garden/promote-task`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      if (res.ok) { showToast('→ task added to Inbox'); return; }
    } catch (e) { /* fall through */ }
    showToast('Couldn’t reach the server');
  }

  // ── Weekly harvest (the Monday digest) ──────────────────────────────
  function mdInline(s) {
    s = escapeHtml(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      (m, t, u) => `<a href="${escapeHtml(safeUrl(u.replace(/&amp;/g, '&')))}" target="_blank" rel="noopener">${t}</a>`);
    return s;
  }

  async function loadHarvest() {
    const el = document.getElementById('harvest');
    try {
      if (LOCAL) {
        const files = await (await fetch(`${API}/api/garden/digests`)).json();
        if (!Array.isArray(files) || files.length === 0) return;   // stay hidden
        const txt = await (await fetch(`${API}/digests/${encodeURIComponent(files[0])}`)).text();
        if (!txt.trim()) return;
        renderHarvest(el, txt, files.slice(1));
        el.hidden = false;
        return;
      }
      // Hosted: the LIVE harvest only (digest.md). The dated `digests/` archive
      // needs a Dropbox folder listing per load — too chatty on a phone, the same
      // carve-out the newsletter archive takes — so past harvests stay LOCAL-only.
      const md = ((await (await apiFetch(`${API}/api/garden/digest`)).json()) || {}).markdown;
      if (!md || !md.trim()) return;
      renderHarvest(el, md, []);
      el.hidden = false;
    } catch (e) { /* stay hidden on any failure */ }
  }

  function renderHarvest(el, md, older) {
    const parts = md.split(/^###\s+Theme tidy-up\s*$/m);
    let html = "<h2>This week&rsquo;s harvest</h2>";
    for (const para of parts[0].split(/\n{2,}/)) {
      const t = para.trim();
      if (t) html += `<p>${mdInline(t)}</p>`;
    }
    const merges = [];
    (parts[1] || '').replace(/-\s*Merge\s+"([^"]+)"\s+into\s+"([^"]+)"/g,
      (m, a, b) => { merges.push([a, b]); return m; });
    // Theme-merge Apply is a WRITE (records.merge_theme) — LOCAL only.
    if (merges.length && LOCAL) {
      html += '<div class="merge-row"><span>Tidy up themes:</span>';
      for (const [a, b] of merges) {
        html += `<button data-from="${escapeHtml(a)}" data-to="${escapeHtml(b)}">`
          + `Merge &ldquo;${escapeHtml(a)}&rdquo; &rarr; &ldquo;${escapeHtml(b)}&rdquo;</button>`;
      }
      html += '</div>';
    }
    if (older && older.length) {
      html += `<div class="past"><details><summary>Past harvests (${older.length})</summary>`
        + older.map(f => `<div><a href="${API}/digests/${encodeURIComponent(f)}" target="_blank" rel="noopener">${escapeHtml(f.replace(/\.md$/, ''))}</a></div>`).join('')
        + '</details></div>';
    }
    el.innerHTML = html;
    el.querySelectorAll('.merge-row button').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await fetch(`${API}/api/garden/merge-themes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: btn.getAttribute('data-from'), to: btn.getAttribute('data-to') })
          });
          btn.textContent = 'merged ✓';
          await fetchGarden();   // refresh chips + counts
        } catch (e) { btn.disabled = false; }
      });
    });
  }

  document.getElementById('search').addEventListener('input', render);

  // The dashboard is at '/' on the Mac server but at 'index.html' on a project
  // Pages site — keep the back link relative-safe (the same fix as the header
  // Garden link on the dashboard side).
  if (!LOCAL) {
    const bl = document.querySelector('.back-link');
    if (bl) bl.setAttribute('href', 'index.html');
  }

  renderConnectGate();   // hosted mode: show/hide the Dropbox connect bar
  fetchGarden();
  loadHarvest();
</script>
</body>
</html>
