<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triage · Home</title>
<style>
  /* Palette + type from the approved mockup (mockups/home-v1.html, "I love it!"):
     charcoal ink, faint-blue cool tones, lane colors purple/blue/green/gray,
     amber reserved for the system-warning pill. Zero webfonts. */
  :root {
    --text: #37352f;
    --text-2: #787774;
    --text-3: #a5a39e;
    --line: rgba(38, 60, 92, 0.10);
    --hover: rgba(38, 70, 120, 0.05);
    --press: rgba(38, 70, 120, 0.09);
    --side: #f3f6fa;
    --page: #ffffff;
    --callout: #f1f5fa;
    --red: #c4554d;      --red-bg: #fdebec;
    --purple: #8a67ab;   --purple-bg: #f4f0f8;
    --orange: #cc782f;   --orange-bg: #fbecdd;
    --yellow: #c29343;   --yellow-bg: #fbf3db;
    --blue: #487ca5;     --blue-bg: #e7f3f8;
    --green: #548164;    --green-bg: #edf3ec;
    --gray: #b4b2ad;     --gray-bg: #eaf0f6;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Apple SD Gothic Neo", sans-serif;
    --radius: 6px;
    /* Today-view accent tokens, ported from the approved mockup
       (mockups/today-v2.html — "1000x better", John). A slightly stronger cool
       blue than --blue, used only by the .t2-* Today components; the other five
       views keep the existing palette untouched. No red/orange anywhere. */
    --t-accent: #3d5fc4;
    --t-accent-soft: #e9eefb;
    --t-mark: #2f4fb5;
    --t-wait: #8b93a7;
    --t-board: #fbfcfe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--side); border-right: 1px solid var(--line); padding: 14px 8px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; }
  .ws { display: flex; align-items: center; gap: 8px; padding: 6px 10px 14px; font-weight: 600; font-size: 14px; }
  .ws-mark { width: 20px; height: 20px; border-radius: 5px; background: #37352f; display: grid; place-items: center; }
  .ws-mark svg { width: 12px; height: 12px; }
  .nav { display: flex; align-items: center; gap: 9px; padding: 5px 10px; border-radius: var(--radius); color: var(--text-2); font-size: 14px; font-weight: 500; text-decoration: none; }
  .nav:hover { background: var(--hover); }
  .nav.on { background: var(--press); color: var(--text); }
  .nav svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .nav .n { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .side-h { font-size: 12px; font-weight: 600; color: var(--text-3); padding: 18px 10px 4px; }
  .side-focus { display: flex; align-items: center; gap: 9px; padding: 4px 10px; font-size: 14px; color: var(--text-2); border-radius: var(--radius); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .side-foot { margin-top: auto; padding: 8px 6px 4px; }
  .seg { display: flex; background: var(--press); border-radius: 7px; padding: 2px; }
  .seg button { flex: 1; font-size: 13px; padding: 4px 0; border-radius: 5px; color: var(--text-2); }
  .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* ---------- page ---------- */
  .main { min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 18px; font-size: 14px; color: var(--text-2); position: sticky; top: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); z-index: 5; }
  .crumb b { color: var(--text); font-weight: 500; }
  .status { margin-left: auto; display: inline-flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .status button { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #8a6a2b; background: var(--yellow-bg); padding: 2px 9px; border-radius: 999px; }
  .status .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); flex: none; }
  .status-detail { display: none; font-size: 12px; color: var(--text-2); background: var(--yellow-bg); border-radius: 8px; padding: 7px 11px; max-width: 320px; line-height: 1.45; }
  .status.open .status-detail { display: block; }
  .status-detail ul { margin: 0; padding-left: 16px; }

  .page { max-width: 760px; margin: 0 auto; padding: 44px 32px 120px; }
  h1 { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: var(--text-2); margin: 0 0 30px; }

  /* the memo */
  .memo { background: var(--callout); border-radius: 8px; padding: 18px 22px 16px; margin-bottom: 36px; }
  .memo-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; padding: 7px 0; }
  .memo-row + .memo-row { border-top: 1px solid var(--line); }
  .memo-k { font-size: 13px; font-weight: 600; color: var(--text-2); padding-top: 1px; }
  .memo-v p { margin: 0; }
  .memo-v p + p { margin-top: 4px; }
  .memo-v .mline.clk { cursor: pointer; }
  .memo-v .mline.clk:hover { color: var(--text); text-decoration: underline; text-decoration-color: var(--line); }
  .memo-row.main .memo-v { font-size: 17px; font-weight: 600; }
  .memo-row.main .memo-v span { font-weight: 400; color: var(--text-2); font-size: 15px; }
  .memo-row.heads .memo-k { color: #8a6a2b; }

  /* capture */
  .capture { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 34px; box-shadow: 0 1px 2px rgba(15,15,15,.03); background: #fff; }
  .capture svg { width: 16px; height: 16px; stroke: var(--text-3); fill: none; stroke-width: 1.8; stroke-linecap: round; flex: none; }
  .capture input { flex: 1; border: 0; outline: 0; font: inherit; color: var(--text); background: transparent; min-width: 0; }
  .capture input::placeholder { color: var(--text-3); }
  .kinds { display: flex; gap: 4px; }
  .kinds button { font-size: 12px; color: var(--text-2); padding: 3px 9px; border-radius: 5px; }
  .kinds button:hover, .kinds button.on { background: var(--press); color: var(--text); }
  /* Drop is the primary capture — filled, so the eye lands on it (Enter = Drop). */
  .kinds button.drop { background: var(--text); color: #fff; font-weight: 600; }
  .kinds button.drop:hover, .kinds button.drop.on { background: #000; color: #fff; }

  /* groups + rows */
  .group { margin-bottom: 24px; }
  .g-head { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 4px 6px; margin-left: -6px; border-radius: var(--radius); font-size: 15px; font-weight: 600; }
  .g-head:hover { background: var(--hover); }
  .tri { width: 14px; height: 14px; color: var(--text-3); transition: transform .15s ease; flex: none; }
  .group.closed .tri { transform: rotate(-90deg); }
  .g-count { color: var(--text-3); font-weight: 400; font-size: 14px; }
  .g-note { margin-left: auto; color: var(--text-3); font-weight: 400; font-size: 13px; }
  .g-body { margin-top: 4px; }
  .group.closed .g-body { display: none; }
  .empty { color: var(--text-3); font-size: 14px; padding: 6px 0 2px 28px; }
  .more { display: inline-block; font-size: 13px; color: var(--text-2); padding: 5px 0 2px 28px; }
  .more:hover { color: var(--text); text-decoration: underline; }

  .row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px 10px; align-items: start; padding: 7px 6px; margin: 0 -6px; border-radius: var(--radius); }
  .row:hover { background: var(--hover); }
  .check { width: 16px; height: 16px; margin-top: 3px; border-radius: 50%; border: 1.5px solid #c8c6c1; display: grid; place-items: center; transition: all .12s ease; }
  .check:hover { border-color: var(--text-2); }
  .row.done .check { background: var(--text); border-color: var(--text); }
  .row.done .check::after { content: ""; width: 7px; height: 4px; border-left: 1.6px solid #fff; border-bottom: 1.6px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
  .row.done .t { color: var(--text-3); text-decoration: line-through; }
  .rmid { min-width: 0; }
  .t { font-weight: 500; cursor: pointer; }
  .t:hover { color: #000; }
  .lanedot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
  .sug { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 8px; vertical-align: middle; }
  .af { font-size: 10px; font-weight: 500; letter-spacing: .02em; color: var(--text-3); background: var(--gray-bg); border-radius: 4px; padding: 0 5px; margin-left: 8px; vertical-align: middle; }
  .n2 { color: var(--text-2); font-size: 14px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); white-space: nowrap; padding-top: 2px; }
  .who { color: var(--text-2); }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--gray-bg); color: var(--text-2); }
  .detail { grid-column: 2 / -1; display: none; font-size: 14px; color: var(--text-2); border-left: 2px solid var(--line); padding: 4px 0 6px 12px; margin: 4px 0 2px; }
  .row.open .detail { display: block; }
  .detail p { margin: 0 0 8px; }
  .detail a.link { color: var(--blue); text-decoration: none; }
  .detail a.link:hover { text-decoration: underline; }
  .ns-edit { display: flex; gap: 6px; margin: 0 0 8px; }
  .ns-edit input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font: inherit; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; align-items: center; }
  .acts button { font-size: 13px; padding: 3px 10px; border-radius: 5px; border: 1px solid var(--line); color: var(--text); background: #fff; }
  .acts button:hover { background: var(--hover); }
  .acts .mv-lbl, .acts .lane-lbl { color: var(--text-3); font-size: 13px; margin-right: 2px; }
  .acts .danger:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-bg); }
  .acts .primary { background: var(--text); color: #fff; border-color: var(--text); }
  .acts .primary:hover { background: #000; }
  .lanepill { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: #fff; }
  .lanepill.on { color: #fff; border-color: transparent; }
  .lanepill.on.never_late { background: var(--purple); }
  .lanepill.on.dont_drop { background: var(--blue); }
  .lanepill.on.wiggle { background: var(--yellow); }
  .lanepill.on.admin { background: var(--gray); }
  .daypick { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 8px; align-items: center; }
  .daypick button { font-size: 12px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line); background: #fff; }
  .daypick button:hover { background: var(--hover); }

  /* focus cards */
  .focus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fcard { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .fcard:hover { background: #f9fbfd; }
  .fcard .ft { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .fcard .fn { color: var(--text-2); font-size: 14px; margin-top: 4px; }
  .fcard .fm { font-size: 12px; color: var(--text-3); margin-top: 8px; }
  .fcard .fchip { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--green); background: #eef5ee; border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
  /* The FSP "Research this week" line — quiet, neutral, under Focus (2026-11). */
  .research-line { color: var(--text-2); font-size: 13px; margin: 8px 2px 2px; }

  /* doorways */
  .doors { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 34px; }
  .door { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; color: var(--text); text-decoration: none; }
  .door:hover { background: var(--hover); }
  .door b { font-variant-numeric: tabular-nums; }
  .door span { color: var(--text-2); }
  .h2 { font-size: 13px; font-weight: 600; color: var(--text-3); margin: 0 0 8px; }

  /* "Changed by the system" strip (2026-11) — a quiet receipt list under the memo. */
  .syschanges { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 10px; margin: 0 0 20px; background: #fff; }
  .syschange-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--text); padding: 4px 0; }
  .syschange-row + .syschange-row { border-top: 1px solid var(--line); }
  .syschange-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc-undo { flex: none; font-size: 12px; padding: 2px 10px; border-radius: 5px; border: 1px solid var(--line); color: var(--text-2); background: #fff; cursor: pointer; }
  .sc-undo:hover { background: var(--hover); color: var(--text); }
  .syschange-more { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--text-2); text-decoration: none; }

  .foot { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); }

  /* ---------- sweeps ---------- */
  .sweep-receipt { background: var(--green-bg); color: var(--green); font-size: 14px; padding: 9px 13px; border-radius: 8px; margin-bottom: 22px; }
  .sweep-clear { color: var(--text-3); font-size: 15px; padding: 24px 0; }
  .sweep-list { display: flex; flex-direction: column; gap: 4px; }
  .sweep-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; }
  .sweep-item:hover { background: var(--hover); }
  .sweep-item .si-label { font-weight: 600; }
  .sweep-item .si-n { font-variant-numeric: tabular-nums; color: var(--text-2); background: var(--gray-bg); border-radius: 999px; padding: 1px 9px; font-size: 13px; }
  .sweep-item .si-note { color: var(--text-3); font-size: 13px; }
  .sweep-item .si-chev { width: 15px; height: 15px; color: var(--text-3); margin-left: auto; flex: none; }
  .sweep-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .sweep-back { font-size: 14px; color: var(--text-2); padding: 4px 6px; margin-left: -6px; border-radius: 6px; }
  .sweep-back:hover { background: var(--hover); color: var(--text); }
  .sweep-prog { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .sweep-clearall { margin-left: auto; font-size: 13px; color: var(--text-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
  .sweep-clearall:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-bg); }
  .sweep-card { max-width: 540px; margin: 10px auto 0; border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; box-shadow: 0 1px 3px rgba(15,15,15,.05); }
  .sweep-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .sc-q { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 0 12px; }
  .sc-title { font-size: 19px; font-weight: 600; line-height: 1.3; }
  .sc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px; color: var(--text-2); margin-top: 8px; }
  .sc-meta .lanetag { background: var(--gray-bg); border-radius: 4px; padding: 1px 7px; }
  .sc-memo { font-size: 14px; color: var(--text-2); margin: 12px 0 0; }
  .sweep-card .link { color: var(--blue); text-decoration: none; }
  .sweep-card .link:hover { text-decoration: underline; }
  .sweep-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .sweepbtn { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .sweepbtn:hover { background: var(--hover); }
  .sweepbtn.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .sweepbtn.primary:hover { background: #000; }
  .sweepbtn.primary kbd { background: rgba(255,255,255,.2); color: #fff; }
  .sweepbtn.danger:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-bg); }
  .sweepbtn kbd, .sweep-hint kbd { font-family: var(--sans); font-size: 11px; font-weight: 600; background: var(--gray-bg); color: var(--text-2); border-radius: 4px; padding: 1px 6px; min-width: 18px; text-align: center; }
  .sweep-card .daypick { margin: 12px 0 0; }
  .sweep-card .daypick button { padding: 7px 11px; }
  .sweep-date { border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; }
  .lanepickrow { gap: 6px; }
  .sweep-hint { font-size: 12px; color: var(--text-3); text-align: center; margin: 16px auto 0; max-width: 540px; }
  @media (max-width: 720px) {
    .sweep-card { padding: 18px 16px; }
    .sweepbtn { flex: 1 1 auto; justify-content: center; min-height: 44px; }
  }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--text); color: #fff; font-size: 14px; padding: 9px 14px; border-radius: 8px; display: none; align-items: center; gap: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.22); z-index: 40; }
  .toast.show { display: flex; }
  .toast button { color: #8fc0ff; font-weight: 600; }
  @media (max-width: 720px) { .toast { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); } }

  /* error bar */
  #ui-error-bar { display: none; position: fixed; top: 0; left: 0; right: 0; background: var(--red); color: #fff; font-size: 12px; padding: 7px 12px; z-index: 100; font-family: var(--sans); white-space: pre-wrap; }

  /* server-down banner */
  #server-down { display: none; background: var(--red-bg); color: var(--red); font-size: 14px; padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; align-items: center; gap: 12px; }
  #server-down.show { display: flex; }
  #server-down button { border: 1px solid var(--red); border-radius: 5px; padding: 2px 10px; color: var(--red); }

  /* hosted (phone/laptop) Dropbox connect-gate — same pattern as garden.html */
  #connect-gate { display: none; background: var(--blue-bg); color: var(--blue); font-size: 14px; padding: 11px 14px; border-radius: 8px; margin-bottom: 20px; align-items: center; gap: 12px; flex-wrap: wrap; }
  #connect-gate.show { display: flex; }
  #connect-gate a { border: 1px solid var(--blue); border-radius: 6px; padding: 3px 11px; color: var(--blue); text-decoration: none; font-weight: 500; }
  #connect-gate a:hover { background: #fff; }

  /* Areas card overflow (⋯) menu — keyboard-operable, closes on outside/Esc */
  .pc-menu-wrap { position: relative; margin-left: auto; }
  .pc-menu-btn { border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; background: #fff; color: var(--text-2); font-size: 15px; line-height: 1; }
  .pc-menu-btn:hover { background: var(--hover); color: var(--text); }
  .pc-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(15,15,15,.12); padding: 4px; min-width: 150px; display: flex; flex-direction: column; gap: 1px; }
  .pc-menu button { text-align: left; font-size: 13px; padding: 6px 10px; border-radius: 5px; color: var(--text); background: #fff; width: 100%; }
  .pc-menu button:hover { background: var(--hover); }
  .pc-menu button.danger:hover { background: var(--red-bg); color: var(--red); }

  .tabbar { display: none; }
  .lens-seg-m { display: none; }

  /* ---------- phone ---------- */
  @media (max-width: 720px) {
    .shell { display: block; }
    .side { display: none; }
    .lens-seg-m { display: inline-flex; margin-left: auto; }
    .topbar { padding: 4px 16px; }
    .page { padding: 24px 16px 96px; }
    h1 { font-size: 28px; }
    .memo { padding: 16px 16px 14px; margin-bottom: 28px; }
    .memo-row { grid-template-columns: 1fr; gap: 2px; }
    .row { grid-template-columns: 22px minmax(0, 1fr); }
    .meta { grid-column: 2; padding-top: 0; }
    .t2-meal, .t2-two { grid-template-columns: 1fr !important; }
    .t2-wrow { grid-template-columns: 22px minmax(0, 1fr) 24px; }
    .focus { grid-template-columns: 1fr; }
    .g-note { display: none; }
    .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
    .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--text-3); text-decoration: none; }
    .tabbar a.on { color: var(--text); }

  }

  /* ---------- Areas / Library / Kitchen (Phase 5) ---------- */
  .col-head { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 4px 6px; margin-left: -6px; border-radius: var(--radius); font-size: 15px; font-weight: 600; }
  .col-head:hover { background: var(--hover); }
  .side-focus > span:last-child { display: flex; flex-direction: column; min-width: 0; }
  .side-focus-next { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* focus picker */
  .focus-prompt { font-size: 14px; color: var(--text); margin: 4px 0 10px; }
  .focus-pick { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; }
  .focus-hint { font-size: 12px; color: var(--text-3); margin: 0 0 8px; }
  .fp-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }
  .focus-change { font-size: 13px; color: var(--text-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 11px; margin-bottom: 20px; }
  .focus-change:hover { background: var(--hover); color: var(--text); }

  /* project cards */
  .pcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .pcard.isfocus { border-color: var(--green); }
  .pcard.area { background: #fbfcfd; }
  .pc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pc-title { font-weight: 600; }
  .pc-focus { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--green); }
  .pc-mv { margin-left: auto; font-size: 12px; color: var(--text-3); }
  .pc-note { display: block; text-align: left; color: var(--text-2); font-size: 14px; margin-top: 6px; }
  .pc-note:hover { color: var(--text); }
  .pc-note .pc-ed { color: var(--text-3); font-size: 12px; }
  .pc-addnote { display: block; text-align: left; color: var(--text-3); font-size: 13px; margin-top: 6px; }
  .pc-addnote:hover { color: var(--text-2); }
  .pc-tasks { display: block; text-align: left; color: var(--blue); font-size: 13px; margin-top: 8px; }
  .pc-tasks:hover { text-decoration: underline; }
  .pc-rows { margin: 6px 0 2px; }
  .pc-quiet { font-size: 13px; color: var(--text-2); }
  .add-proj { display: flex; gap: 8px; margin: 4px 0 24px; }
  .add-proj input { flex: 1; border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; font: inherit; }
  .add-proj button { border: 1px solid var(--line); border-radius: 7px; padding: 7px 14px; background: #fff; }
  .add-proj button:hover { background: var(--hover); }
  .pcard.done { opacity: .82; }
  .pc-goal { margin-top: 6px; font-size: 14px; color: var(--text); }
  .pc-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .pc-tags .tag.journal { background: var(--green-bg); color: var(--green); }
  .pc-tags .tag.housing { background: var(--blue-bg); color: var(--blue); }

  /* research priorities (two standing cards) + research sub-labels */
  .priorities { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 4px 0 20px; }
  .priority { padding: 15px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--callout); }
  .priority.p1 { border-left: 4px solid var(--green); }
  .priority.p2 { border-left: 4px solid var(--blue); }
  .pri-k { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .priority h3 { margin: 4px 0 5px; font-size: 15px; }
  .priority p { margin: 0; color: var(--text-2); font-size: 13.5px; }
  .h3r { display: flex; align-items: baseline; gap: 7px; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 18px 0 8px; }
  .h3r-n { color: var(--text-3); font-weight: 400; }
  .research-portfolio-link { display: inline-block; margin: 10px 0 4px; font-size: 13px; color: var(--blue); text-decoration: none; }
  .research-portfolio-link:hover { text-decoration: underline; }

  /* Open calls (Projects view) + the Decide/Auto-filed flashcard sub-forms */
  .opp-row { padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .oc-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  .oc-title { font-weight: 500; }
  .oc-kind { font-size: 12px; color: var(--text-2); background: var(--gray-bg); border-radius: 4px; padding: 1px 7px; }
  .oc-date { font-size: 13px; color: var(--text-2); }
  .oc-link { font-size: 12px; color: var(--blue); text-decoration: none; margin-left: auto; }
  .oc-link:hover { text-decoration: underline; }
  .oc-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .oc-acts button { font-size: 12px; padding: 3px 11px; border-radius: 5px; border: 1px solid var(--line); background: #fff; color: var(--text-2); }
  .oc-acts button:hover { background: var(--hover); color: var(--text); }
  .oc-form { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .oc-form input, .oc-form select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .oc-form input[type="text"], .oc-form .oc-pass-reason { flex: 1; min-width: 160px; }
  .oc-form button { font-size: 12px; padding: 5px 11px; border-radius: 5px; border: 1px solid var(--line); background: #fff; color: var(--text-2); }
  .oc-form button.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .oc-form button:hover { background: var(--hover); color: var(--text); }
  .oc-form button.primary:hover { background: #000; color: #fff; }
  /* Decide flashcard: the submit (date + project) sub-form stacks on a phone. */
  .sweep-card .oppsub { flex-direction: row; }
  .sweep-card .oppsub select, .sweep-card .oppsub input { border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; }
  .sweep-card .refilerow button { padding: 7px 11px; }
  @media (max-width: 720px) { .sweep-card .oppsub { flex-direction: column; align-items: stretch; } }

  /* library rows */
  .lib-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .lib-row .lr-main { flex: 1; min-width: 0; }
  .lr-title { font-weight: 500; color: var(--text); text-decoration: none; }
  .lr-title:hover { color: var(--blue); text-decoration: underline; }
  .lr-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .lr-sum { font-size: 13px; color: var(--text-2); margin-top: 3px; }
  .lr-acts { display: flex; flex-wrap: wrap; gap: 6px; flex: none; }
  .lr-acts button { font-size: 12px; padding: 3px 9px; border-radius: 5px; border: 1px solid var(--line); background: #fff; color: var(--text-2); }
  .lr-acts button:hover { background: var(--hover); color: var(--text); }
  .lr-acts button.danger:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-bg); }
  .lr-take { font-style: italic; color: var(--text-2); font-size: 13px; margin-top: 3px; }
  .rl-edit { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .rl-edit input, .rl-edit textarea { border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; width: 100%; }
  .rl-edit textarea { min-height: 52px; resize: vertical; }
  .rl-edit-row { display: flex; align-items: center; gap: 6px; }
  .rl-edit-row .rl-edit-mins { width: 88px; flex: none; }
  .rl-edit-row button { font-size: 12px; padding: 4px 11px; border-radius: 5px; border: 1px solid var(--line); background: #fff; color: var(--text-2); }
  .rl-edit-row button.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .rl-edit-row button:hover { background: var(--hover); color: var(--text); }
  .rl-edit-row button.primary:hover { opacity: .9; color: #fff; background: var(--text); }
  .lib-search { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 11px; font: inherit; margin-bottom: 10px; }
  .news-md { font-size: 14px; color: var(--text-2); line-height: 1.55; }
  .news-md h2, .news-md h3, .news-md h4 { font-size: 14px; font-weight: 600; color: var(--text); margin: 14px 0 4px; }
  .news-md p { margin: 0 0 8px; }
  .news-md a { color: var(--blue); text-decoration: none; }
  .news-md a:hover { text-decoration: underline; }

  /* kitchen rows */
  .rec-row { border-bottom: 1px solid var(--line); padding: 2px 0; }
  .rec-head { display: flex; align-items: center; gap: 10px; padding: 8px 2px; }
  .rec-title { flex: 1; min-width: 0; text-align: left; font-weight: 500; color: var(--text); }
  .rec-title:hover { color: var(--blue); }
  .rec-meta { font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .rec-cook { font-size: 12px; padding: 3px 10px; border-radius: 5px; border: 1px solid var(--line); background: #fff; color: var(--text-2); flex: none; }
  .rec-cook:hover { background: var(--hover); color: var(--text); }
  .rec-detail { padding: 2px 2px 12px 2px; font-size: 14px; color: var(--text-2); }
  .rec-detail .link { color: var(--blue); text-decoration: none; }
  .rec-detail ul { margin: 4px 0 8px; padding-left: 20px; }
  .rec-notes { color: var(--text-2); }
  @media (max-width: 720px) {
    .lib-row { flex-direction: column; gap: 6px; }
    .pc-mv { margin-left: 0; }
    .priorities { grid-template-columns: 1fr; }
  }

  /* ---------- "Today" main page (2026-11-18 audit) ---------- */
  /* collapsed system-changes line */
  .syschange-line { display: inline-block; font-size: 13px; color: var(--text-2); background: var(--callout); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; margin: 0 0 20px; }
  .syschange-line:hover { background: var(--hover); color: var(--text); }
  .sc-collapse { display: inline-block; font-size: 12px; color: var(--text-3); margin: 2px 0 20px; padding: 2px 8px; border-radius: 5px; }
  .sc-collapse:hover { background: var(--hover); color: var(--text); }

  /* goals */
  .goals { margin: 0 0 26px; }
  .goal { margin: 0 0 4px; font-size: 14px; color: var(--text-2); padding-left: 14px; position: relative; }
  .goal::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

  /* research — the meal (visually heaviest) */
  .research { margin: 0 0 40px; }
  .rm-empty { color: var(--text-3); font-size: 14px; padding: 8px 0; }
  .rm-empty a { color: var(--blue); }
  .rm-card { border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; background: #fff; box-shadow: 0 1px 2px rgba(15,15,15,.03); }
  .rm-title { font-size: 18px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .rm-chip { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--green); background: #eef5ee; border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
  .rm-outcome { font-size: 14px; color: var(--text); margin-top: 8px; font-weight: 500; }
  .rm-when { color: var(--text-3); font-weight: 400; }
  .rm-left, .rm-next { font-size: 14px; color: var(--text-2); margin-top: 10px; line-height: 1.5; }
  .rm-k { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin-right: 6px; }
  .rm-nm-form { display: flex; gap: 6px; margin-top: 6px; }
  .rm-nm-in { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; }
  .rm-nm-form button { font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .rm-nm-form button:hover { background: var(--hover); }
  .block-start { margin-top: 14px; font-size: 14px; font-weight: 600; color: #fff; background: var(--green); border-radius: 8px; padding: 9px 16px; }
  .block-start:hover { filter: brightness(.95); }
  .block-form { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .block-form .block-task { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; }
  .block-form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .block-min-l { font-size: 13px; color: var(--text-2); }
  .block-min { width: 56px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: inherit; margin-left: 4px; }
  .block-res { flex: 1; min-width: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; }
  .block-form-row button { font-size: 13px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .block-form-row button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  .block-hint { font-size: 12px; color: var(--text-3); margin-top: 8px; }
  .block-run { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; text-align: center; }
  .block-count { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--green); }
  .block-task-label { font-size: 14px; color: var(--text-2); margin-top: 2px; }
  .block-note { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; margin-top: 12px; }
  .block-run-acts { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .block-run-acts button { font-size: 14px; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .block-run-acts button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  .ideas { margin-top: 18px; }
  .ideas-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin: 0 0 4px; }
  .idea { margin: 0 0 3px; font-size: 14px; color: var(--text-2); }

  /* Projects: Daily | Planning mode toggle + the daily card (2026-11-19) */
  .pmode { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 8px; padding: 2px; margin: 0 0 18px; background: #fff; }
  .pmode-btn { font-size: 13px; font-weight: 600; color: var(--text-2); padding: 5px 16px; border-radius: 6px; background: transparent; }
  .pmode-btn:hover { color: var(--text); }
  .pmode-btn.on { background: var(--callout); color: var(--text); }
  .pdcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #fff; box-shadow: 0 1px 2px rgba(15,15,15,.03); }
  .pdcard.compact { padding: 11px 14px; background: #fbfcfd; }
  .pdcard.isfocus { border-left: 3px solid var(--green); }
  .pd-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pd-title { font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
  .pdcard.compact .pd-title { font-size: 14px; font-weight: 600; }
  .pd-runway { font-size: 14px; color: var(--text); margin-top: 8px; font-weight: 500; }
  .pd-when { color: var(--text-3); font-weight: 400; }
  .pd-line { font-size: 14px; color: var(--text-2); margin-top: 10px; line-height: 1.5; }
  .pd-k { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin-right: 6px; }
  .pd-val { text-align: left; color: var(--text-2); }
  .pd-val:hover { color: var(--text); }
  .pd-val .pc-ed { color: var(--text-3); font-size: 12px; }
  .pd-age { color: var(--text-3); }
  .pd-none { color: var(--text-3); }
  .pd-none-edit { color: var(--text-3); text-align: left; }
  .pd-none-edit:hover { color: var(--text-2); }
  .pd-edit { display: inline-flex; gap: 6px; margin-top: 4px; }
  .pd-edit input { min-width: 180px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .pd-edit button { font-size: 13px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .pd-edit button:hover { background: var(--hover); }
  .pd-nm-form { display: inline-flex; gap: 6px; margin-top: 4px; margin-left: 4px; }
  .pd-nm-in { min-width: 180px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .pd-nm-form button { font-size: 13px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .pd-nm-form button:hover { background: var(--hover); }
  .pd-wayin { font-size: 13px; color: var(--text-2); margin-top: 10px; padding: 7px 11px; background: var(--callout); border-radius: 7px; }
  .pd-ideas { margin: 2px 0 20px; }
  .pd-ideas-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin: 0 0 4px; }
  .pd-idea { margin: 0 0 3px; font-size: 14px; color: var(--text-3); }
  .pc-outcomes { margin-top: 8px; }
  .pc-outcomes .rm-outcome { font-size: 13.5px; }

  /* memo, collapsed below research */
  .memo-collapse { margin: 0 0 34px; }
  .memo-toggle { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: var(--text-2); padding: 4px 6px; margin-left: -6px; border-radius: var(--radius); }
  .memo-toggle:hover { background: var(--hover); color: var(--text); }
  .memo-toggle .tri { width: 14px; height: 14px; color: var(--text-3); transition: transform .15s ease; }
  .memo-collapse:not(.open) .tri { transform: rotate(-90deg); }
  .memo-collapse-body { margin-top: 10px; }
  .memo-collapse-body .memo { margin-bottom: 0; }

  /* today, negotiated (the vegetables) */
  .veg { margin: 0 0 36px; }
  .veg-h { font-size: 1.28rem; font-weight: 650; letter-spacing: -.01em; margin: 0 0 10px; }
  .veg-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
  .veg-cap { font-weight: 600; }
  .veg-est { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .portion { background: var(--callout); border-radius: 10px; padding: 10px 14px 12px; margin-bottom: 16px; }
  .portion-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin: 2px 0 6px; }
  .portion-empty { color: var(--text-3); font-size: 14px; padding: 10px 0 16px; }
  .prow { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 6px 10px; align-items: start; padding: 7px 4px; border-radius: var(--radius); }
  .prow:hover { background: rgba(255,255,255,.6); }
  .prow + .prow { border-top: 1px solid var(--line); }
  .prow .check { width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 1.5px solid #c8c6c1; background: #fff; }
  .prow .check:hover { border-color: var(--text-2); }
  .check-spacer { width: 16px; }
  .prow-mid { min-width: 0; }

  .prow-why { font-size: 13px; color: var(--text-2); margin-top: 1px; }
  .prow-acts { display: flex; align-items: center; gap: 4px; }
  .pmove { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text-2); font-size: 13px; line-height: 1; }
  .pmove:hover:not([disabled]) { background: var(--hover); color: var(--text); }
  .pmove[disabled] { opacity: .3; cursor: default; }
  .pdrop { font-size: 12px; color: var(--text-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; background: #fff; }
  .pdrop:hover { background: var(--hover); color: var(--text); }
  .veg-over { font-size: 13px; color: var(--text-2); background: var(--callout); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
  .veg-cands-h { margin-top: 6px; }
  .veg-clear { color: var(--text-3); font-size: 14px; padding: 4px 0; }
  .crow { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 4px 10px; align-items: start; padding: 9px 6px; margin: 0 -6px; border-radius: var(--radius); }

  .crow-mid { min-width: 0; }
  .crow-t { font-weight: 500; text-align: left; }
  .crow-t .slip { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 8px; }
  .crow-why { font-size: 13px; color: var(--text-2); margin-top: 1px; }
  .crow-acts { display: flex; align-items: center; gap: 6px; }
  .crow-acts button { font-size: 13px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text); }
  .crow-acts button:hover { background: var(--hover); }
  .crow-acts button.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .crow-acts button.primary:hover { background: #000; }
  .ab-head { font-weight: 500; color: var(--text); }

<script>
/* ===== error reporting first (the dashboard's reportUiError lesson) ===== */
function reportUiError(msg) {
  try {
    var bar = document.getElementById('ui-error-bar');
    if (!bar) return;
    bar.textContent = String(msg).slice(0, 400);
    bar.style.display = 'block';
  } catch (e) {}
}
window.onerror = function (m, src, line, col, err) { reportUiError((err && err.stack) ? err.stack : (m + ' @' + line)); };
window.addEventListener('unhandledrejection', function (e) { reportUiError('Promise: ' + ((e.reason && e.reason.stack) || e.reason)); });

/* <<<PURE>>> membership + ordering rules — extracted and unit-tested by
   scripts/test-home-logic.mjs. NOTHING in this block may touch document/window. */
// Retired auto-draft boilerplate (server default until 2026-10-02): not a real next step.
function cleanNext(s) { s = s || ''; return /^open draft in mail, tune, send$/i.test(s.trim()) ? '' : s; }

var LANES = ['never_late', 'dont_drop', 'wiggle', 'admin'];

function laneOf(i) { var l = i && i.lane; return LANES.indexOf(l) >= 0 ? l : 'dont_drop'; }
function isProposedTask(i) { return !!(i && i.proposed); }

function _parseYMD(s) {
  if (!s) return null;
  var m = String(s).slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  return Date.UTC(+m[1], +m[2] - 1, +m[3]);
}
// (date - today) in whole days; negative = past/overdue. Both read from LOCAL
// calendar parts (never toISOString), the dashboard's getWeekDays precedent.
function dayDelta(dateStr, today) {
  var a = _parseYMD(dateStr), b = _parseYMD(today);
  if (a == null || b == null) return null;
  return Math.round((a - b) / 86400000);
}
function daysPast(dateStr, today) { var d = dayDelta(dateStr, today); return d == null ? 0 : -d; }
function askDays(t, today) { return daysPast(t.lastEmailAt || t.created || '', today); }

function normTaskRow(t, linkedDeadline, today) {
  var dateStr = (linkedDeadline && linkedDeadline.due_date) || t.scheduled || null;
  // A self-set `target` (not a commitment) carries no urgency — propagate it from
  // a linked target deadline so the task row reads calm too (never overdue style).
  var target = !!(t.target || (linkedDeadline && linkedDeadline.target));
  return {
    id: t.id, kind: 'task', text: t.text || '', who: t.who || '', lane: laneOf(t),
    url: t.url || '', source: t.source || '', nextStep: cleanNext(t.nextStep), memo: t.memo || '',
    list: t.list, proposed: isProposedTask(t), suggested: false, target: target,
    tier: t.tier || '', project_id: t.project_id || null,
    est_minutes: (typeof t.est_minutes === 'number' && t.est_minutes > 0) ? t.est_minutes : null,
    dateStr: dateStr, days: dateStr ? dayDelta(dateStr, today) : null,
    askDays: askDays(t, today), createdMs: Date.parse(t.created || '') || 0,
    deadline_id: linkedDeadline ? linkedDeadline.id : (t.deadline_id || null),
    filed_by: t.filed_by || null, filed_at: t.filed_at || null
  };
}
function normDeadlineRow(d, today) {
  return {
    id: d.id, kind: 'deadline', text: d.title || '', who: d.who || '', lane: laneOf(d),
    url: '', source: d.source || '', nextStep: '', memo: d.notes || '',
    list: 'deadline', proposed: !!d.proposed, suggested: false, target: !!d.target,
    dateStr: d.due_date || null, days: d.due_date ? dayDelta(d.due_date, today) : null,
    askDays: daysPast(d.created || '', today), createdMs: Date.parse(d.created || '') || 0,
    deadline_id: d.id,
    filed_by: d.filed_by || null, filed_at: d.filed_at || null
  };
}
function normWaitingRow(t, today) {
  return {
    id: t.id, kind: 'task', text: t.text || '', who: t.who || '', lane: 'admin',
    url: t.url || '', source: t.source || '', nextStep: cleanNext(t.nextStep), memo: t.memo || '',
    list: 'waiting', proposed: false, suggested: false, dateStr: null, days: null,
    askDays: daysPast(t.waitingSince || t.created || '', today),
    createdMs: Date.parse(t.created || '') || 0, deadline_id: null,
    filed_by: t.filed_by || null, filed_at: t.filed_at || null
  };
}

function _bucket(r) {
  // A target (self-set, not a commitment) is NEVER bucketed overdue — it sorts as
  // an ordinary dated item even past its date, so it carries no urgency.
  if (r.days != null && r.days < 0 && !r.target) return 0;  // overdue
  if (r.days != null) return 1;                // dated, upcoming (incl. a past target)
  if (r.who) return 2;                         // undated, someone waiting
  return 3;                                    // undated
}
// overdue (most overdue first) -> soonest -> oldest ask -> newest
function rowCompare(a, b) {
  var ba = _bucket(a), bb = _bucket(b);
  if (ba !== bb) return ba - bb;
  if (ba === 0 || ba === 1) return a.days - b.days;
  if (ba === 2) return b.askDays - a.askDays;
  return (b.createdMs || 0) - (a.createdMs || 0);
}

// Build the open-task id set and the map taskId -> its linked, not-done deadline.
function _linkIndex(items, deadlines) {
  var openIds = {};
  var i;
  for (i = 0; i < items.length; i++) {
    var t = items[i];
    if (t && t.id && t.list !== 'done' && t.list !== 'tabs') openIds[t.id] = true;
  }
  var byTask = {};
  for (i = 0; i < deadlines.length; i++) {
    var d = deadlines[i];
    if (!d || d.status === 'done') continue;
    if (d.linked_task_id && openIds[d.linked_task_id]) byTask[d.linked_task_id] = d;
  }
  return { openIds: openIds, byTask: byTask };
}

// Home membership: inbox/thisweek tasks that are NOT proposed (+ a named-person
// never_late/dont_drop proposal older than 3 days, marked suggested); not-done
// deadlines with no linked open task; past-scheduled tasks and proposed items
// are excluded from Home and counted for Sweeps instead; someday never on Home.
function homeLaneItems(items, deadlines, today) {
  items = items || []; deadlines = deadlines || [];
  var lanes = { never_late: [], dont_drop: [], wiggle: [], admin: [] };
  var waiting = [];
  var pastTasks = 0, emailSuggestions = 0, pastDeadlines = 0;
  var idx = _linkIndex(items, deadlines);
  var i, t, d;

  for (i = 0; i < items.length; i++) {
    t = items[i];
    if (!t || t.list === 'done' || t.list === 'tabs' || t.list === 'someday') continue;
    if (t.list === 'waiting') { waiting.push(normWaitingRow(t, today)); continue; }
    // inbox / thisweek
    if (isProposedTask(t)) {
      emailSuggestions++;
      var lane = laneOf(t);
      if ((lane === 'never_late' || lane === 'dont_drop') &&
          (t.who && String(t.who).trim()) && askDays(t, today) > 3) {
        var sr = normTaskRow(t, idx.byTask[t.id], today);
        sr.suggested = true;
        lanes[lane].push(sr);
      }
      continue;
    }
    if (t.scheduled && dayDelta(t.scheduled, today) < 0) { pastTasks++; continue; }  // → Sweeps
    lanes[laneOf(t)].push(normTaskRow(t, idx.byTask[t.id], today));
  }

  for (i = 0; i < deadlines.length; i++) {
    d = deadlines[i];
    if (!d || d.status === 'done') continue;
    // A target deadline is a self-set target, not a commitment: never a Home
    // urgency and never "past-due". It shows in the Tasks ledger / its project
    // rows as an ordinary calm row (and, if it has a linked open task, that task
    // already showed above carrying the calm target flag).
    if (d.target) continue;
    var past = d.due_date && dayDelta(d.due_date, today) < 0;
    if (d.proposed) { if (past) pastDeadlines++; continue; }  // proposals never on Home
    if (past) pastDeadlines++;
    if (d.linked_task_id && idx.openIds[d.linked_task_id]) continue;  // shown as the task
    lanes[laneOf(d)].push(normDeadlineRow(d, today));
  }

  LANES.forEach(function (k) { lanes[k].sort(rowCompare); });
  waiting.sort(function (a, b) { return b.askDays - a.askDays; });
  return {
    never_late: lanes.never_late, dont_drop: lanes.dont_drop,
    wiggle: lanes.wiggle, admin: lanes.admin, waiting: waiting,
    sweeps: { pastTasks: pastTasks, emailSuggestions: emailSuggestions, pastDeadlines: pastDeadlines }
  };
}

// Tasks view: the complete ledger — every open task in inbox/thisweek/waiting/
// someday grouped by lane (past-scheduled INCLUDED), plus a someday group and an
// email-suggestions group. No 6-row cap, no suggested-only filter on proposals.
function tasksLaneItems(items, deadlines, today) {
  items = items || []; deadlines = deadlines || [];
  var lanes = { never_late: [], dont_drop: [], wiggle: [], admin: [] };
  var waiting = [], someday = [], proposals = [];
  var idx = _linkIndex(items, deadlines);
  var i, t, d;
  for (i = 0; i < items.length; i++) {
    t = items[i];
    if (!t || t.list === 'done' || t.list === 'tabs') continue;
    if (isProposedTask(t)) { proposals.push(normTaskRow(t, idx.byTask[t.id], today)); continue; }
    if (t.list === 'someday') { someday.push(normTaskRow(t, idx.byTask[t.id], today)); continue; }
    if (t.list === 'waiting') { waiting.push(normWaitingRow(t, today)); continue; }
    lanes[laneOf(t)].push(normTaskRow(t, idx.byTask[t.id], today));
  }
  for (i = 0; i < deadlines.length; i++) {
    d = deadlines[i];
    if (!d || d.status === 'done' || d.proposed) continue;
    if (d.linked_task_id && idx.openIds[d.linked_task_id]) continue;
    lanes[laneOf(d)].push(normDeadlineRow(d, today));
  }
  LANES.forEach(function (k) { lanes[k].sort(rowCompare); });
  waiting.sort(function (a, b) { return b.askDays - a.askDays; });
  proposals.sort(function (a, b) { return b.askDays - a.askDays; });
  someday.sort(function (a, b) { return (b.createdMs || 0) - (a.createdMs || 0); });
  return {
    never_late: lanes.never_late, dont_drop: lanes.dont_drop, wiggle: lanes.wiggle,
    admin: lanes.admin, waiting: waiting, someday: someday, proposals: proposals
  };
}

// ── Sweep queues (John's "deadline sweep", Phase 4) ───────────────────
// Like Tab Sweep: when items pass their date the system ASKS, one tap each,
// nothing vanishes silently (Q1). Each predicate returns an array of rows; the
// Home "Sweeps waiting" strip, the nav count AND the Sweeps view all read these
// SAME functions, so the numbers can never disagree.
var SWEPT_QUIET_DAYS = 14;   // a kept "still owe it" leaves Old replies this long
var OLD_REPLY_DAYS = 14;     // an email task older than this is up for review
var WAITING_CHECK_DAYS = 14; // a waiting item older than this is up for review

// 1. This-Week tasks whose scheduled date is in the past (open, not proposed).
function sweepStuckTasks(items, today) {
  items = items || [];
  var out = [];
  for (var i = 0; i < items.length; i++) {
    var t = items[i];
    if (!t || t.list !== 'thisweek' || isProposedTask(t)) continue;
    if (t.scheduled && dayDelta(t.scheduled, today) < 0) out.push(normTaskRow(t, null, today));
  }
  out.sort(rowCompare);
  return out;
}

// 2. Old replies (the welcome-back reset): open, NON-proposed email tasks in
// inbox/thisweek older than 14 days, EXCEPT ones swept within the last 14 days
// (John said "still owe it", so leave them be for two weeks). Oldest ask first.
function sweepOldReplies(items, today) {
  items = items || [];
  var out = [];
  for (var i = 0; i < items.length; i++) {
    var t = items[i];
    if (!t || t.source !== 'email' || isProposedTask(t)) continue;
    if (t.list !== 'inbox' && t.list !== 'thisweek') continue;
    if (askDays(t, today) < OLD_REPLY_DAYS) continue;
    if (t.swept && daysPast(t.swept, today) < SWEPT_QUIET_DAYS) continue;
    out.push(normTaskRow(t, null, today));
  }
  out.sort(function (a, b) { return b.askDays - a.askDays; });
  return out;
}

// 3. Email suggestions: every proposed task, oldest ask first.
function sweepSuggestions(items, today) {
  items = items || [];
  var out = [];
  for (var i = 0; i < items.length; i++) {
    var t = items[i];
    if (t && isProposedTask(t) && t.list !== 'done' && t.list !== 'tabs')
      out.push(normTaskRow(t, null, today));
  }
  out.sort(function (a, b) { return b.askDays - a.askDays; });
  return out;
}

// 4. Past-due deadlines: not-done deadlines whose due date passed (proposed or not).
function sweepPastDeadlines(deadlines, today) {
  deadlines = deadlines || [];
  var out = [];
  for (var i = 0; i < deadlines.length; i++) {
    var d = deadlines[i];
    if (!d || d.status === 'done') continue;
    if (d.target) continue;   // a self-set target can't be "past-due" (not a commitment)
    if (d.due_date && dayDelta(d.due_date, today) < 0) out.push(normDeadlineRow(d, today));
  }
  out.sort(rowCompare);  // most overdue first
  return out;
}

// 5. Past meetings: proposals for events that already happened (server stamps
// `past`/`proposed`). Confirmed meetings are NEVER swept. Raw records (the UI
// reads start/location/attendees directly).
function sweepPastMeetings(meetings) {
  meetings = meetings || [];
  return meetings.filter(function (m) { return !!(m && m.proposed && m.past); });
}

// 6. Projects to check in on (Phase 5, Q6): active kind-PROJECT (areas never
// warn) not moved in >=21 days. "Not touched in N weeks: keep active or park?"
// replaces the word "stalled". days_since_movement is computed server-side.
var CHECKIN_QUIET_DAYS = 21;
function projectsToCheckIn(projects, today) {
  projects = projects || [];
  var out = [];
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    if (!p || p.status !== 'active') continue;
    if (p.kind === 'area') continue;                  // areas never warn
    var d = (typeof p.days_since_movement === 'number') ? p.days_since_movement : null;
    if (d != null && d >= CHECKIN_QUIET_DAYS) out.push(p);
  }
  out.sort(function (a, b) { return (b.days_since_movement || 0) - (a.days_since_movement || 0); });
  return out;
}

// 7. Still waiting? open waiting-list tasks (not proposed) whose wait age
// (waitingSince || created) is more than two weeks, EXCEPT ones swept within the
// last 14 days (John said "still waiting", so leave them be — the Old-replies
// rule). Oldest wait first. Each row is a normWaitingRow (who/memo/url carried).
function sweepWaitingCheck(items, today) {
  items = items || [];
  var out = [];
  for (var i = 0; i < items.length; i++) {
    var t = items[i];
    if (!t || t.list !== 'waiting' || isProposedTask(t)) continue;
    if (daysPast(t.waitingSince || t.created || '', today) <= WAITING_CHECK_DAYS) continue;
    if (t.swept && daysPast(t.swept, today) < SWEPT_QUIET_DAYS) continue;
    out.push(normWaitingRow(t, today));
  }
  out.sort(function (a, b) { return b.askDays - a.askDays; });
  return out;
}

function sweepCounts(items, deadlines, meetings, projects, today, opps, readlater, garden, changes) {
  return {
    suggestions: sweepSuggestions(items, today).length,
    stuck: sweepStuckTasks(items, today).length,
    oldReplies: sweepOldReplies(items, today).length,
    waitingCheck: sweepWaitingCheck(items, today).length,
    pastDeadlines: sweepPastDeadlines(deadlines, today).length,
    pastMeetings: sweepPastMeetings(meetings).length,
    projectsCheckIn: projectsToCheckIn(projects, today).length,
    // "Drop" capture + Opportunities (2026-10-16). decide = dated maybes near their
    // decide-by; autoFiled = records the drop router sorted this week (review set).
    decide: oppDecideQueue(opps || [], today).length,
    autoFiled: autoFiledQueue(items, readlater || [], garden || [], opps || [], today).length,
    // Change log (2026-11): the system-actor receipts to review/undo. `changes` is a
    // trailing-optional arg, so the old 5/8-arg calls still read 0.
    systemChanges: systemChanges(changes || [], today).length
  };
}

// ── Areas / Library pure helpers (Phase 5) ────────────────────────────
// Monday (local) of the week containing `today`, as YYYY-MM-DD.
function weekMonday(today) {
  var t = _parseYMD(today);
  if (t == null) return today;
  var dow = new Date(t).getUTCDay();          // 0=Sun..6=Sat
  var back = (dow === 0) ? 6 : (dow - 1);      // days since Monday
  var m = new Date(t - back * 86400000);
  return m.getUTCFullYear() + '-' + String(m.getUTCMonth() + 1).padStart(2, '0') + '-' + String(m.getUTCDate()).padStart(2, '0');
}
// The focus picker opens when there is no focus at all OR the pick was made
// before this week's Monday (Q5 "Monday: pick one or two projects").
function focusPickerOpen(projects, today) {
  projects = projects || [];
  var focus = projects.filter(function (p) { return p && p.focus && p.status !== 'done'; });
  if (!focus.length) return true;
  var monday = weekMonday(today);
  var newest = '';
  focus.forEach(function (p) { var fs = (p.focus_set || ''); if (fs > newest) newest = fs; });
  return !newest || newest < monday;
}

// ── Projects view: research membership + grouping (ported from research.html) ──
// A project is "research" when its keywords carry the tag `research`
// (case-insensitive) AND NOT `portfolio-strategy` (a strategy card, kept off the
// portfolio). Areas are never research. research.html's exact membership.
function projectHasKeyword(p, kw) {
  return !!(p && (p.keywords || []).some(function (k) { return String(k).toLowerCase() === kw; }));
}
function isResearchProject(p) {
  return !!(p && p.kind !== 'area' && projectHasKeyword(p, 'research') && !projectHasKeyword(p, 'portfolio-strategy'));
}
function _byTitle(a, b) { return String((a && a.title) || '').localeCompare(String((b && b.title) || '')); }
// Partition the (lens-filtered) project list into the Projects-view groups.
// Research → active / incubating (paused) / completed (done), each sorted by
// title (research.html's sort). Non-research kind-projects → other (active) +
// paused (non-research). Areas (kind:"area", not done) kept separate and calm.
function projectGroups(projects) {
  projects = (projects || []).filter(Boolean);
  var research = projects.filter(isResearchProject);
  function rStatus(s) {
    return research.filter(function (p) { return (p.status || 'active') === s; }).slice().sort(_byTitle);
  }
  var nonAreaOther = projects.filter(function (p) { return p.kind !== 'area' && !isResearchProject(p); });
  return {
    researchActive: rStatus('active'),
    researchIncubating: rStatus('paused'),
    researchCompleted: rStatus('done'),
    other: nonAreaOther.filter(function (p) { return (p.status || 'active') === 'active'; }),
    paused: nonAreaOther.filter(function (p) { return p.status === 'paused'; }),
    areas: projects.filter(function (p) { return p.kind === 'area' && p.status !== 'done'; })
  };
}
// Housing/renter (≤2) + top-journal (≤1) chips from keywords (research.html's usefulTags).
function projectTags(p) {
  var words = ((p && p.keywords) || []).map(function (k) { return String(k); });
  var housing = words.filter(function (k) { return /housing|renter/i.test(k); }).slice(0, 2);
  var journal = words.filter(function (k) { return /top journal/i.test(k); }).slice(0, 1);
  var out = [], seen = {};
  housing.concat(journal).forEach(function (t) { if (!seen[t]) { seen[t] = 1; out.push(t); } });
  return out;
}

// ── Projects view: the daily dashboard (2026-11-19 audit) ─────────────
// "A way back in" — ONE deterministic offer, worded as an offer, never a judgment
// and never scolding about elapsed time. The strings live in this one constant so
// they stay easy to reword (no em-dashes, John's standing rule).
var RESTART_QUIET_DAYS = 7;
var RESTART_SUGGESTIONS = {
  blocker: 'One way in: write down the smallest thing that would remove the block, and who could remove it.',
  reread: 'One way in: reread the last note, then 10 minutes on the easiest piece. Stopping after 10 counts.',
  blank: 'One way in: open the main file and write three lines on where it stands. That is the whole session.'
};
// Rule-chosen restart offer (pure, NO AI). First match wins. Areas never get one.
// days_since_movement is the server-computed field; null = never moved = stale.
function restartSuggestion(p, today) {
  if (!p || p.kind === 'area') return '';
  var blocker = (p.blocker || '').trim();
  var note = (p.state_note || '').trim();
  var dsm = (typeof p.days_since_movement === 'number') ? p.days_since_movement : null;
  if (blocker) return RESTART_SUGGESTIONS.blocker;
  if (note && dsm != null && dsm >= RESTART_QUIET_DAYS) return RESTART_SUGGESTIONS.reread;
  if (!note && (dsm == null || dsm >= RESTART_QUIET_DAYS)) return RESTART_SUGGESTIONS.blank;
  return '';   // moved within 7 days: don't clutter a project that is moving
}

// The project's next move: among its open, non-proposed inbox/thisweek tasks, the
// earliest-scheduled/dated one; else the oldest open one (by created). null if none.
function projectNextMove(items, pid, today) {
  var cands = (items || []).filter(function (t) {
    return t && t.project_id === pid && !isProposedTask(t) &&
      (t.list === 'inbox' || t.list === 'thisweek');
  });
  if (!cands.length) return null;
  var scheduled = cands.filter(function (t) { return t.scheduled; });
  if (scheduled.length) {
    scheduled.sort(function (a, b) {
      var da = dayDelta(a.scheduled, today), db = dayDelta(b.scheduled, today);
      if (da == null) return 1;
      if (db == null) return -1;
      if (da !== db) return da - db;
      return (Date.parse(a.created || '') || 0) - (Date.parse(b.created || '') || 0);
    });
    return scheduled[0];
  }
  cands.sort(function (a, b) { return (Date.parse(a.created || '') || 8.64e15) - (Date.parse(b.created || '') || 8.64e15); });
  return cands[0];
}

// Outcomes for a project from the semester plan, soonest `by` first (undated last).
// Pure (takes the plan explicitly, unlike the state-reading outcomesFor()).
function planOutcomesFor(plan, pid) {
  var outs = (plan && Array.isArray(plan.outcomes)) ? plan.outcomes : [];
  return outs.filter(function (o) { return o && o.project_id === pid && (o.title || '').trim(); })
    .slice().sort(function (a, b) { return String(a.by || '9999-99-99').localeCompare(String(b.by || '9999-99-99')); });
}

// Teaching → admin/service → others when the title/keywords let us tell them apart;
// equal ranks keep input order (stable sort). Pure, deterministic.
function _teachRank(p) {
  var s = (((p && p.title) || '') + ' ' + (((p && p.keywords) || []).join(' '))).toLowerCase();
  if (/teach|course|class|pls |grad|advis|student|lecture/.test(s)) return 0;
  if (/admin|service|committee|governance|tenure|dgs|review/.test(s)) return 1;
  return 2;
}

// Daily-mode grouping: four calm buckets, in order. Alive = heartbeat ids (or, with
// no plan, the focus:true projects); Finish and send = non-done projects with a plan
// outcome, nearest `by` first (past-due first, shown calmly, no red); Teaching and
// admin = areas + active non-research projects; Parked = everything else non-done
// (research active without an outcome, and all paused). Done projects are never here.
// Never throws: an empty plan/list and a plan id with no matching project are fine.
function projectDashboardGroups(projects, plan, today) {
  projects = (projects || []).filter(function (p) { return p && p.status !== 'done'; });
  var hb = (plan && Array.isArray(plan.heartbeat)) ? plan.heartbeat : [];
  var aliveSet = {};
  if (hb.length) { hb.forEach(function (id) { aliveSet[id] = true; }); }
  else { projects.forEach(function (p) { if (p.focus) aliveSet[p.id] = true; }); }
  var alive = [], rest = [];
  projects.forEach(function (p) { (aliveSet[p.id] ? alive : rest).push(p); });
  var finishSend = rest.filter(function (p) { return planOutcomesFor(plan, p.id).length > 0; });
  finishSend.sort(function (a, b) {
    var oa = planOutcomesFor(plan, a.id), ob = planOutcomesFor(plan, b.id);
    var ka = oa.length ? (oa[0].by || '9999-99-99') : '9999-99-99';
    var kb = ob.length ? (ob[0].by || '9999-99-99') : '9999-99-99';
    return String(ka).localeCompare(String(kb));
  });
  var remain = rest.filter(function (p) { return planOutcomesFor(plan, p.id).length === 0; });
  var teaching = remain.filter(function (p) {
    return p.kind === 'area' || ((p.status || 'active') === 'active' && !isResearchProject(p));
  });
  var teachSet = {}; teaching.forEach(function (p) { teachSet[p.id] = true; });
  var parked = remain.filter(function (p) { return !teachSet[p.id]; });
  teaching.sort(function (a, b) { return _teachRank(a) - _teachRank(b); });
  return { alive: alive, finishSend: finishSend, teaching: teaching, parked: parked };
}

// tier of a Read Later record: "soon" or "someday" (absent/invalid → someday, Q7).
function rlTier(r) { return (r && r.tier === 'soon') ? 'soon' : 'someday'; }
function readSoonItems(recs) {
  recs = recs || [];
  return recs.filter(function (r) { return r && r.status === 'unread' && rlTier(r) === 'soon'; });
}
function readSomedayItems(recs) {
  recs = recs || [];
  return recs.filter(function (r) { return r && r.status === 'unread' && rlTier(r) === 'someday'; });
}

// ── Opportunities + "Drop" (2026-10-16) ──────────────────────────────
// A "dated maybe" (call for papers, grant, talk, workshop, job posting) surfaces
// ONCE near its decide-by date and is otherwise silent. decide_now is computed
// from LOCAL parts here (never trust a possibly-stale server field): open with no
// decide_by OR days_to_decide <= 21, or a `later` snooze whose later_until has
// arrived. Matches the server/dbx.js contract.
var OPP_DECIDE_HORIZON = 21;
function oppDecideNow(o, today) {

    if (!o.decide_by) return true;                      // no deadline → decide now
    var d = dayDelta(o.decide_by, today);
    return d != null && d <= OPP_DECIDE_HORIZON;        // incl. past decide_by (still owed a decision)
  }
  if (st === 'later') {
    if (!o.later_until) return true;                    // malformed snooze → resurface, never hide
    var l = dayDelta(o.later_until, today);
    return l != null && l <= 0;                         // the snooze has arrived
  }

// the most urgent), nulls LAST for the Open-calls browse list (undated maybes trail).
function _oppDateCompare(a, b, nullsFirst) {

  var db = b.decide_by ? _parseYMD(b.decide_by) : null;

  if (db == null) return nullsFirst ? 1 : -1;

function oppDecideQueue(opps, today) {
  opps = opps || [];
  var out = opps.filter(function (o) {
    if (!o) return false;
    var st = o.status || 'open';

  out.sort(function (a, b) { return _oppDateCompare(a, b, true); });

// Open calls: every still-undecided opportunity (open or later), soonest decide-by

function openCalls(opps) {

  out.sort(function (a, b) { return _oppDateCompare(a, b, false); });
  return out;
}

// "Auto-filed" review (Q1 for Drop, nothing is sorted silently): any record the

function isAutoFiled(rec, today) {
  if (!rec || rec.filed_by !== 'drop') return false;

}
// The Auto-filed queue draws from all four destination stores and wraps each row

  var out = [];

// The ONE fetch seam (Phase 6): LOCAL (the Mac at localhost) → fetch the Python
// server, byte-identical to before. Hosted (phone/laptop on GitHub Pages) →
// read/write Dropbox directly through dbx.js (DBX.handle returns a Response-like
// object; it reads opts.method + opts.body-as-JSON-string, exactly our init
// shape). dbx.js missing → a connect-gate instead of a silent empty page.
function api(path, opts) {
  opts = opts || {};
  var init = { method: opts.method || 'GET', headers: {} };
  if (opts.body !== undefined) {
    var b = opts.body;
    // Stamp the person as the actor on EVERY write (one place): the change-log
    // (2026-11, "nothing disappears silently") infers actor from the body, so a
    // Home write is "user", not "unknown". Object bodies only (arrays like
    // /api/import pass through untouched); never overwrite an explicit actor.
    if (init.method !== 'GET' && b && typeof b === 'object' && !Array.isArray(b) && b.actor === undefined) {
      b = Object.assign({}, b, { actor: 'user' });
    }
    init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(b);
  }
  if (LOCAL) return fetch(path, init);
  if (typeof DBX === 'undefined') {
    renderConnectGate();
    return Promise.resolve({ ok: false, status: 503, json: function () { return Promise.resolve({}); } });
  }
  return DBX.handle(path, init);
}

// Hosted: a visible bar when Dropbox isn't connected, so an empty page never
// reads as "nothing to do". LOCAL → always hidden (mirrors garden.html).
function renderConnectGate() {
  var bar = document.getElementById('connect-gate');
  if (!bar) return;
  var msg = bar.querySelector('.cg-msg'), btn = bar.querySelector('.cg-btn');
  if (LOCAL) { bar.classList.remove('show'); return; }
  if (typeof DBX === 'undefined') {
    if (msg) msg.textContent = 'dbx.js failed to load — hard-refresh the page';
    if (btn) btn.style.display = 'none';
    bar.classList.add('show');
    return;
  }
  Promise.resolve(DBX.ready).catch(function () {}).then(function () {
    if (DBX.connected()) { bar.classList.remove('show'); return; }
    if (msg) msg.textContent = 'Not connected to Dropbox — your data lives in your Dropbox.';
    if (btn) btn.style.display = '';
    bar.classList.add('show');
  });
}
function apiJson(path, opts) {
  return api(path, opts).then(function (r) {
    return r.json().catch(function () { return null; }).then(function (j) { return { ok: r.ok, status: r.status, data: j }; });
  });
}

/* ===== toast / undo (5s deferred commit) ===== */
var _pending = null;
function flushPending() { if (_pending) { var c = _pending.commit; clearTimeout(_pending.timer); _pending = null; try { c(); } catch (e) {} } }
function hideToast() { document.getElementById('toast').classList.remove('show'); }
function showToast(label, onUndo) {
  var t = document.getElementById('toast');
  document.getElementById('toast-label').textContent = label;
  var btn = document.getElementById('toast-undo');
  btn.style.display = onUndo ? '' : 'none';
  t._undo = onUndo || null;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(hideToast, 5200);
}
function undoable(label, commit, restore) {
  flushPending();
  var obj = { commit: commit, restore: restore };
  obj.timer = setTimeout(function () { if (_pending === obj) { _pending = null; try { commit(); } catch (e) {} } }, 5000);
  _pending = obj;
  showToast(label, function () {
    if (_pending === obj) { clearTimeout(obj.timer); _pending = null; try { restore(); } catch (e) {} }
    hideToast();
  });
}

function fetchAll() {
  state.lastFetch = Date.now();
  var gets = [
    apiJson('/api/items'), apiJson('/api/deadlines'), apiJson('/api/meetings'),
    apiJson('/api/projects'), apiJson('/api/memo'), apiJson('/api/health'),
    apiJson('/api/readlater?status=all'), apiJson('/api/newsletter-digest'),
    // Drop + Opportunities (2026-10-16). Both 404 cleanly until the server merge
    // lands → coerced to [], so the Decide/Auto-filed queues simply read empty.
    apiJson('/api/opportunities'), apiJson('/api/garden'),
    // Change log (2026-11): the system-actor receipts for the "Changed by the
    // system" strip + the System-changes sweep. 404 until merged → [].
    apiJson('/api/changes?actor=system&limit=50'),
    // Research blocks this week (FSP, 2026-11): the "Research this week" line under
    // Focus. 404 until merged → null, which researchLine() treats as zero blocks.
    apiJson('/api/research-week'),
    // The "Today" main page (2026-11-18 audit): the semester plan (goals/outcomes/
    // ideas), today's negotiated portion, and the EA's briefings. All degrade to a
    // shell/empty on 404 so a not-yet-merged server never blanks the page.
    apiJson('/api/semester-plan'), apiJson('/api/today'), apiJson('/api/briefings')
  ];
  return Promise.all(gets).then(function (res) {
    var items = res[0];
    if (!items.ok || !Array.isArray(items.data)) { showServerDown(true); renderConnectGate(); return; }
    showServerDown(false);
    if (!LOCAL) renderConnectGate();   // connected + data flowing → hide the gate
    state.items = Array.isArray(items.data) ? items.data : [];
    state.loaded = true;
    state.deadlines = Array.isArray(res[1].data) ? res[1].data : [];
    state.meetings = Array.isArray(res[2].data) ? res[2].data : [];
    state.projects = (res[3].data && Array.isArray(res[3].data.projects)) ? res[3].data.projects : [];
    if (res[4].status === 404) { state.memo = null; state.memoMissing = true; }
    else { state.memo = (res[4].data && typeof res[4].data === 'object') ? res[4].data : null; state.memoMissing = false; }
    state.health = (res[5].data && typeof res[5].data === 'object') ? res[5].data : null;
    state.readlater = Array.isArray(res[6].data) ? res[6].data : [];
    state.newsletter = (res[7].data && typeof res[7].data === 'object') ? res[7].data : null;
    state.opps = Array.isArray(res[8].data) ? res[8].data : [];
    state.garden = Array.isArray(res[9].data) ? res[9].data : [];
    state.changes = Array.isArray(res[10].data) ? res[10].data : [];
    state.research = (res[11] && res[11].data && typeof res[11].data === 'object' && !Array.isArray(res[11].data)) ? res[11].data : null;
    state.semesterPlan = (res[12] && res[12].data && typeof res[12].data === 'object' && !Array.isArray(res[12].data)) ? res[12].data : null;
    state.today = (res[13] && res[13].data && typeof res[13].data === 'object' && Array.isArray(res[13].data.items)) ? res[13].data : { date: null, items: [] };
    state.briefings = Array.isArray(res[14] && res[14].data) ? res[14].data : [];
    if (state.view === 'kitchen') ensureRecipes();

function weekRowHtml(today) {
  var r = state.research || null;

  var map = {}; byDay.forEach(function (d) { if (d && d.date) map[d.date] = d; });
  var monday = weekMonday(today);
  var base = _parseYMD(monday);
  var labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
  var cells = '';
  for (var i = 0; i < 5; i++) {
    var ds = _ymdOf(base + i * 86400000);

    var d = map[ds];

function eventWhen(start, end) {
  var a = String(start || '').slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!a) return '';
  var y = +a[1], mo = +a[2], d = +a[3];
  var b = end ? String(end).slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/) : null;
  if (b) {

    if (y === y2 && mo === mo2) return MONTHS[mo - 1] + ' ' + d + '–' + d2 + ', ' + y;
    if (y === y2) return MONTHS[mo - 1] + ' ' + d + ' – ' + MONTHS[mo2 - 1] + ' ' + d2 + ', ' + y;
    return MONTHS[mo - 1] + ' ' + d + ', ' + y + ' – ' + MONTHS[mo2 - 1] + ' ' + d2 + ', ' + y2;
