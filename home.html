function mmss(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); }
var _blockInterval = null;
function openBlock(pid) { state.blockPanel = (state.blockPanel === pid) ? null : pid; render(); }
function cancelBlock() {
  if (_blockInterval) { clearInterval(_blockInterval); _blockInterval = null; }
  state.block = null; state.blockPanel = null; render();
}
function startBlock(pid) {
  var taskEl = document.getElementById('block-task');
  var minEl = document.getElementById('block-min');
  var resEl = document.getElementById('block-res');
  var task = taskEl ? taskEl.value.trim() : '';
  var minutes = minEl ? parseInt(minEl.value, 10) : 25;
  if (!minutes || minutes < 1) minutes = 25;
  if (minutes > 240) minutes = 240;
  var p = (state.projects || []).find(function (x) { return x.id === pid; });
  var nm = p ? nextMoveFor(p) : null;
  state.block = {
    projectId: pid, taskId: (nm && nm.id) ? nm.id : null,
    task: task || (nm ? (nm.text || '') : ''),
    minutes: minutes, startedIso: new Date().toISOString(),
    endMs: Date.now() + minutes * 60000, running: true,
    resistance: resEl ? resEl.value.trim() : ''
  };
  render();
  if (_blockInterval) clearInterval(_blockInterval);
  _blockInterval = setInterval(tickBlock, 1000);
  tickBlock();
}
function tickBlock() {
  if (!state.block || !state.block.running) {
    if (_blockInterval) { clearInterval(_blockInterval); _blockInterval = null; }
    return;
  }
  var remain = Math.max(0, Math.round((state.block.endMs - Date.now()) / 1000));
  var el = document.getElementById('block-countdown');
  if (el) el.textContent = mmss(remain);
  if (remain <= 0) finishBlock('done');
}
function finishBlock(outcome) {
  if (!state.block) return;
  if (_blockInterval) { clearInterval(_blockInterval); _blockInterval = null; }
  var b = state.block;
  var elapsed = Math.max(1, Math.min(b.minutes, Math.round((Date.now() - Date.parse(b.startedIso)) / 60000)));
  var minutes = (outcome === 'done') ? b.minutes : elapsed;
  var noteEl = document.getElementById('block-note');
  var note = noteEl ? noteEl.value.trim() : '';
  var res = (b.resistance || '').trim();
  var body = {
    skill: 'block', started: b.startedIso, minutes: minutes,
    project_id: b.projectId || '', task_id: b.taskId || '', task: b.task || '',
    outcome: outcome, resistance: res ? [res] : [], note: note
  };
  state.block = null; state.blockPanel = null;
  render();
  apiJson('/api/session-log', { method: 'POST', body: body }).then(function (res2) {
    showToast(res2 && res2.ok ? ('Block logged: ' + fmtHM(minutes)) : 'Block not logged', null);
    fetchAll();
  }).catch(function () { showToast('Block not logged', null); fetchAll(); });
}

  if (key === 'systemChanges') return systemChanges(c.changes, c.today);

}
function currentSweepCountsSource() {
  return {
    items: lensItems().filter(function (i) { return !optimistic[i.id]; }),
    deadlines: lensDeadlines().filter(function (d) { return !optimistic[d.id]; }),
    meetings: (state.meetings || []).filter(function (m) { return inDomain(m, state.lens) && !optimistic[m.id]; }),
    projects: (state.projects || []).filter(function (p) { return inDomain(p, state.lens) && !optimistic[p.id]; }),
    opps: lensOpps(),
    readlater: (state.readlater || []).filter(function (r) { return !optimistic[r.id]; }),
    garden: (state.garden || []).filter(function (g) { return !optimistic[g.id]; }),
    changes: (state.changes || []).filter(function (c) { return !optimistic[c.ts]; }),
    today: todayISO()
  };
}
function openSweepQueue(key) {
  if (key === 'pastMeetings' && !LOCAL) return;   // meetings are read-only hosted
  var cards = sweepCardsFor(key);
  if (!cards.length) { state.sweepReceiptLine = ''; render(); return; }
  state.sweepQueue = key; state._lastQueue = key;
  state.sweepCards = cards; state.sweepIndex = 0;
  state.sweepTally = {}; state.sweepPick = null; state.sweepReceiptLine = '';
  render();
}
function buildReceipt(t) {
  var parts = [], total = 0;
  TALLY_ORDER.forEach(function (k) {
    var n = t[k] || 0;
    if (n) { total += n; parts.push(n + ' ' + TALLY_LABEL[k]); }
  });
  if (!total) return 'Nothing changed.';
  return 'Cleared ' + total + ': ' + parts.join(', ');
}
function finishSweep() {
  state.sweepReceiptLine = buildReceipt(state.sweepTally || {});
  state.sweepQueue = null; state.sweepPick = null;
  render();
}
function exitSweepQueue() {
  state.sweepQueue = null; state.sweepPick = null; state.sweepReceiptLine = '';
  if (state.sweepDirty) { state.sweepDirty = false; fetchAll(); } else render();
}
// Commit a sweep action: tally it, hide the item, advance a card, defer the
// server write 5s (undoable), exactly like the dashboard's flashcards.
function sweepStep(label, tally, id, commitFn) {
  var idx = state.sweepIndex, prevQueue = state.sweepQueue;
  state.sweepTally[tally] = (state.sweepTally[tally] || 0) + 1;
  state.sweepPick = null;
  state.sweepDirty = true;
  if (id) optimistic[id] = true;
  state.sweepIndex++;
  if (state.sweepIndex >= state.sweepCards.length) finishSweep(); else render();
  undoable(label, function () {
    commitFn().then(function () { if (id) delete optimistic[id]; fetchAll(); })
      .catch(function () { if (id) delete optimistic[id]; fetchAll(); });
  }, function () {
    state.sweepTally[tally] = Math.max(0, (state.sweepTally[tally] || 0) - 1);
    if (id) delete optimistic[id];
    // only re-enter the card if we're still on the Sweeps view; otherwise just
    // undo the data (the restored item reappears wherever the user now is).
    if (state.view === 'sweeps') {
      state.sweepQueue = prevQueue || state._lastQueue;
      state.sweepIndex = idx; state.sweepPick = null; state.sweepReceiptLine = '';
    }
    render();
  });
}
function sweepSkip() {
  state.sweepPick = null;
  state.sweepIndex++;
  if (state.sweepIndex >= state.sweepCards.length) finishSweep(); else render();
}
function sweepToggle(which) { state.sweepPick = (state.sweepPick === which) ? null : which; render(); }

// Nudge helpers (browser side): derive a follow-up's person + topic from a
// waiting row. `who` wins; else parse a name out of the title; else "them".
function waitingWho(row) {
  if (row.who && String(row.who).trim()) return String(row.who).trim();
  var t = String(row.text || '');
  var m = t.match(/reply from\s+(.+?)\s+re:/i);
  if (m) return m[1].trim();
  m = t.match(/^\s*waiting\s+(?:on|for|to hear (?:back )?from)\s+([A-Z][\w.'-]*(?:\s+[A-Z][\w.'-]*){0,2})/i);
  if (m) return m[1].trim();
  return 'them';
}
// The topic = the title minus the "Waiting:" / "Waiting on/for" / "reply from X
// re:" machine prefixes; kept short.
function waitingTopic(text) {
  var s = String(text || '').trim();
  s = s.replace(/^waiting\b\s*:?\s*/i, '');
  s = s.replace(/^(?:on|for|to hear (?:back )?from)\s+/i, '');
  s = s.replace(/^reply from\s+.+?\s+re:\s*/i, '');
  s = s.trim();
  if (s.length > 80) s = s.slice(0, 80).trim();
  return s;
}

function handleSweepAction(act, payload) {
  var key = state.sweepQueue, row = (state.sweepCards || [])[state.sweepIndex];
  if (!row || !key) return;
  if (act === 'skip') return sweepSkip();
  if (act === 'pickday') return sweepToggle('pickday');
  if (act === 'newdate') return sweepToggle('newdate');
  if (act === 'lane') return sweepToggle('lane');
  if (act === 'submit' && key === 'decide') return sweepToggle('submit');
  if (act === 'pass' && key === 'decide') return sweepToggle('pass');
  if (act === 'change' && key === 'autoFiled') return sweepToggle('refile');
  // System-changes: Keep = advance (no write); Undo = reverse via /api/changes/undo
  // through the shared 5s undoable. Keyed by the change line's own ts (so one record
  // with two receipts stays distinct). Handled before the generic `name`/`id` below.
  if (key === 'systemChanges') {
    if (act === 'keep') { state.sweepTally.kept = (state.sweepTally.kept || 0) + 1; return sweepSkip(); }
    if (act === 'undo') {
      var cts = row.ts, cid = row.id;
      return sweepStep('Undone: ' + changeLabel(row), 'undone', cts, function () {
        return api('/api/changes/undo', { method: 'POST', body: { ts: cts, id: cid || '' } });
      });
    }
    return;
  }
  var id = row.id,
    name = (key === 'pastMeetings' || key === 'projectsCheckIn') ? (row.title || 'project')
      : (key === 'decide') ? (row.title || 'opportunity')
      : (key === 'autoFiled') ? (row.title || 'item')
      : displayText(row);

  if (key === 'stuck') {
    if (act === 'today') return sweepStep('Scheduled today: ' + name, 'rescheduled', id, function () { return api('/api/schedule', { method: 'POST', body: { id: id, day: todayISO(), calendar: false } }); });
    if (act === 'schedpick') return sweepStep('Rescheduled: ' + name, 'rescheduled', id, function () { return api('/api/schedule', { method: 'POST', body: { id: id, day: payload, calendar: false } }).then(function () { return api('/api/skip', { method: 'POST', body: { id: id } }); }); });
    if (act === 'someday') return sweepStep('To Someday: ' + name, 'someday', id, function () { return api('/api/move', { method: 'POST', body: { id: id, list: 'someday' } }); });
    if (act === 'done') return sweepStep('Done: ' + name, 'done', id, function () { return api('/api/done', { method: 'POST', body: { id: id } }); });
    if (act === 'drop') return sweepStep('Dropped: ' + name, 'dropped', id, function () { return api('/api/delete', { method: 'POST', body: { id: id } }); });
  } else if (key === 'oldReplies') {
    if (act === 'owe') return sweepStep('Kept: ' + name, 'owed', id, function () { return api('/api/task/swept', { method: 'POST', body: { id: id } }); });
    if (act === 'done') return sweepStep('Done: ' + name, 'done', id, function () { return api('/api/done', { method: 'POST', body: { id: id } }); });
    if (act === 'someday') return sweepStep('To Someday: ' + name, 'someday', id, function () { return api('/api/move', { method: 'POST', body: { id: id, list: 'someday' } }); });
    if (act === 'drop') return sweepStep('Dropped: ' + name, 'dropped', id, function () { return api('/api/delete', { method: 'POST', body: { id: id } }); });
  } else if (key === 'waitingCheck') {
    if (act === 'gotit') return sweepStep('Got it: ' + name, 'done', id, function () { return api('/api/done', { method: 'POST', body: { id: id } }); });
    if (act === 'nudge') {
      // Keep the waiting item (swept → leaves this queue for 14 days) AND drop a
      // follow-up into the Inbox so the nudge becomes a real task to act on.
      var who = waitingWho(row), topic = waitingTopic(row.text);
      var fuText = 'Follow up with ' + who + (topic ? ': ' + topic : '');
      return sweepStep('Nudged: ' + name, 'nudged', id, function () {
        return api('/api/capture', { method: 'POST', body: { text: fuText, list: 'inbox', lane: 'dont_drop' } })
          .then(function () { return api('/api/task/swept', { method: 'POST', body: { id: id } }); });
      });
    }
    if (act === 'stillwait') return sweepStep('Still waiting: ' + name, 'kept', id, function () { return api('/api/task/swept', { method: 'POST', body: { id: id } }); });
    if (act === 'drop') return sweepStep('Dropped: ' + name, 'dropped', id, function () { return api('/api/delete', { method: 'POST', body: { id: id } }); });
  } else if (key === 'suggestions') {
    if (act === 'confirm') return sweepStep('Confirmed: ' + name, 'confirmed', id, function () { return api('/api/task/confirm', { method: 'POST', body: { id: id } }); });
    if (act === 'lanepick') return sweepStep('Confirmed: ' + name, 'confirmed', id, function () { return api('/api/set-lane', { method: 'POST', body: { id: id, lane: payload } }).then(function () { return api('/api/task/confirm', { method: 'POST', body: { id: id } }); }); });
    if (act === 'done') return sweepStep('Done: ' + name, 'done', id, function () { return api('/api/task/confirm', { method: 'POST', body: { id: id } }).then(function () { return api('/api/done', { method: 'POST', body: { id: id } }); }); });
    if (act === 'dismiss') return sweepStep('Dismissed: ' + name, 'dismissed', id, function () { return api('/api/task/dismiss-proposal', { method: 'POST', body: { id: id } }); });
  } else if (key === 'pastDeadlines') {
    if (act === 'done') return sweepStep('Done: ' + name, 'done', id, function () { return api('/api/deadlines/update', { method: 'POST', body: { id: id, fields: { status: 'done' } } }); });
    if (act === 'datepick') {
      var proposed = !!row.proposed, day = payload;
      return sweepStep('New date: ' + name, 'rescheduled', id, function () {
        var p = api('/api/deadlines/update', { method: 'POST', body: { id: id, fields: { due_date: day } } });
        return proposed ? p.then(function () { return api('/api/deadlines/confirm', { method: 'POST', body: { id: id } }); }) : p;
      });
    }
    if (act === 'drop') return sweepStep('Dropped: ' + name, 'dropped', id, function () { return api('/api/deadlines/delete', { method: 'POST', body: { id: id } }); });
  } else if (key === 'pastMeetings') {
    if (act === 'keep') return sweepStep('Added to calendar: ' + name, 'kept', id, function () { return api('/api/meetings/confirm', { method: 'POST', body: { id: id } }); });
    if (act === 'clear') return sweepStep('Cleared: ' + name, 'cleared', id, function () { return api('/api/meetings/delete', { method: 'POST', body: { id: id } }); });
  } else if (key === 'projectsCheckIn') {
    // Keep active = re-save the current state note, which bumps movement (no "stalled").
    if (act === 'keepactive') return sweepStep('Kept active: ' + name, 'kept', id, function () { return api('/api/projects/state', { method: 'POST', body: { id: id, note: row.state_note || '' } }); });
    if (act === 'park') return sweepStep('Parked: ' + name, 'parked', id, function () { return api('/api/projects/update', { method: 'POST', body: { id: id, fields: { status: 'paused' } } }); });
    if (act === 'projdone') return sweepStep('Done: ' + name, 'done', id, function () { return api('/api/projects/update', { method: 'POST', body: { id: id, fields: { status: 'done' } } }); });
  } else if (key === 'decide') {
    if (act === 'later') return sweepStep('To later: ' + name, 'later', id, function () { return oppDecideLater(id); });
    if (act === 'drop') return sweepStep('Dropped: ' + name, 'dropped', id, function () { return oppDelete(id); });
    if (act === 'submitgo') {
      var due = (payload && payload.due_date || '').trim();
      if (!due) { showToast('Pick a submission deadline', null); return; }   // a submit becomes a real deadline → needs a date
      var pid = (payload && payload.project_id || '').trim();
      return sweepStep('Now a real deadline — ' + name, 'submitted', id, function () { return oppDecideSubmit(id, due, pid); });
    }
    if (act === 'passgo') {
      var reason = (payload || '').trim();
      return sweepStep('Passed: ' + name, 'passed', id, function () { return oppDecidePass(id, reason); });
    }
  } else if (key === 'autoFiled') {
    // Keep = right place, advance with NO write (nothing changed → not undoable).
    if (act === 'keep') { state.sweepTally.kept = (state.sweepTally.kept || 0) + 1; return sweepSkip(); }
    if (act === 'refileto') {
      var target = payload;
      if (!target || target === row.store) return;   // same store = no-op
      return sweepStep('Refiled to ' + storeLabel(target) + ': ' + name, 'refiled', id, function () { return refileCommit(row, target); });
    }
    if (act === 'drop') return sweepStep('Dropped: ' + name, 'dropped', id, function () { return api(oppStoreDeletePath(row.store), { method: 'POST', body: { id: id } }); });
  }
}

// ── Opportunity decide core (shared by the Decide flashcard + the Projects
//    Open-calls inline actions) + the Auto-filed refile chain ─────────────
function oppDecideSubmit(id, due_date, project_id) {
  return api('/api/opportunities/decide', { method: 'POST', body: { id: id, decision: 'submit', due_date: due_date || '', project_id: project_id || '' } });
}
function oppDecidePass(id, reason) {
  return api('/api/opportunities/decide', { method: 'POST', body: { id: id, decision: 'pass', reason: reason || '' } });
}
function oppDecideLater(id) {
  return api('/api/opportunities/decide', { method: 'POST', body: { id: id, decision: 'later' } });
}
function oppDelete(id) { return api('/api/opportunities/delete', { method: 'POST', body: { id: id } }); }

function oppStoreDeletePath(store) {
  return store === 'read' ? '/api/readlater/delete'
    : store === 'garden' ? '/api/garden/delete'
      : store === 'opportunity' ? '/api/opportunities/delete'
        : '/api/delete';
}
// Pull a generic {title, url, note} out of any store's record.
function refileFields(w) {
  var r = w.rec || {};
  return {
    title: r.title || r.text || r.url || '',
    url: r.url || '',
    note: r.note || r.memo || r.my_take || r.summary || ''
  };
}
// Refile = create in the NEW store, then (ONLY on a confirmed ok) delete from the
// old store — never delete without a confirmed add (the documented data-loss rule).
// The whole chain is deferred 5s inside sweepStep's undoable, so Undo cancels it
// before anything is written. The refiled record carries NO filed_by (a human
// decision, so it never re-enters the Auto-filed queue).
function refileCommit(w, target) {
  var f = refileFields(w), createP;
  if (target === 'task') createP = apiJson('/api/capture', { method: 'POST', body: { text: f.title || f.note || '(untitled)', url: f.url, memo: f.note, list: 'inbox' } });
  else if (target === 'read') createP = apiJson('/api/readlater/add', { method: 'POST', body: { url: f.url, title: f.title, note: f.note, source: 'dashboard' } });
  else if (target === 'garden') createP = apiJson('/api/garden/add', { method: 'POST', body: { text: f.title, url: f.url, note: f.note } });
  else createP = apiJson('/api/opportunities/add', { method: 'POST', body: { title: f.title, url: f.url, note: f.note } });
  return createP.then(function (res) {
    var okAdd = res && (res.ok || res.status === 200 || res.status === 201);
    if (!okAdd) { showToast('Could not refile — kept it', null); throw new Error('refile add failed'); }
    return api(oppStoreDeletePath(w.store), { method: 'POST', body: { id: w.id } });
  });
}

function sweepClearAllMeetings() {
  var cards = (state.sweepCards || []).slice();
  var ids = cards.map(function (m) { return m.id; }).filter(Boolean);
  if (!ids.length) return;
  ids.forEach(function (id) { optimistic[id] = true; });
  state.sweepTally.cleared = (state.sweepTally.cleared || 0) + ids.length;
  state.sweepDirty = true;
  finishSweep();
  undoable('Cleared ' + ids.length + ' past meeting suggestions', function () {
    Promise.all(ids.map(function (id) { return api('/api/meetings/delete', { method: 'POST', body: { id: id } }); }))
      .then(function () { ids.forEach(function (id) { delete optimistic[id]; }); fetchAll(); })
      .catch(function () { ids.forEach(function (id) { delete optimistic[id]; }); fetchAll(); });
  }, function () {
    ids.forEach(function (id) { delete optimistic[id]; });
    state.sweepTally.cleared = Math.max(0, (state.sweepTally.cleared || 0) - ids.length);
    state.sweepQueue = state._lastQueue; state.sweepIndex = 0; state.sweepReceiptLine = '';
    render();
  });
}

// "3 days ago" / "yesterday" / "today" (LOCAL parts, never toISOString).
function relAge(dateStr, today) {
  var dd = dayDelta(String(dateStr || '').slice(0, 10), today);
  if (dd == null) return '';
  if (dd === 0) return 'today';
  if (dd === -1) return 'yesterday';
  return (-dd) + ' days ago';
}
// The outcome to SHOW on a daily card: the nearest not-yet-passed, else the latest
// past one (outs is already soonest-first with undated last).
function _repOutcome(outs, today) {
  var future = outs.filter(function (o) { return o.by && dayDelta(o.by, today) != null && dayDelta(o.by, today) >= 0; });
  if (future.length) return future[0];
  var dated = outs.filter(function (o) { return o.by; });
  if (dated.length) return dated[dated.length - 1];
  return outs[0] || null;
}

// Minimal, safe markdown → HTML: headings, bold, links (safeUrl), paragraphs.
function mdToHtml(md) {
  var lines = String(md || '').split(/\r?\n/);
  var out = [], para = [];
  function flush() { if (para.length) { out.push('<p>' + mdInline(para.join(' ')) + '</p>'); para = []; } }
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    var hm = ln.match(/^(#{1,4})\s+(.*)$/);
    if (hm) { flush(); var lvl = Math.min(hm[1].length + 1, 4); out.push('<h' + lvl + '>' + mdInline(hm[2]) + '</h' + lvl + '>'); continue; }
    if (!ln.trim()) { flush(); continue; }
    para.push(ln.trim());
  }
  flush();
  return out.join('');
}
function mdInline(s) {
  s = escapeHtml(s);
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (m, t, u) { return '<a href="' + escapeHtml(safeUrl(u)) + '" target="_blank" rel="noopener">' + t + '</a>'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}

// Projects-view Open-calls list: inline Submit / Pass / Later, same server effects
// as the Decide flashcard. Later is immediate; Submit opens a date+project form;
// Pass opens an optional-reason input (the reason itself stays optional).
function handleOpenCallAction(act, id) {
  if (act === 'opp-submit') { state.oppInline = (state.oppInline && state.oppInline.id === id && state.oppInline.mode === 'submit') ? null : { id: id, mode: 'submit' }; render(); return; }
  if (act === 'opp-pass') { state.oppInline = (state.oppInline && state.oppInline.id === id && state.oppInline.mode === 'pass') ? null : { id: id, mode: 'pass' }; render(); return; }
  if (act === 'opp-cancel') { state.oppInline = null; render(); return; }
  if (act === 'opp-later') { flushPending(); state.oppInline = null; oppDecideLater(id).then(fetchAll); return; }
  if (act === 'opp-submit-go') {
    var root = document.querySelector('.opp-row[data-opp="' + cssEsc(id) + '"]');
    var di = root && root.querySelector('.oc-sub-date'), ps = root && root.querySelector('.oc-sub-proj');
    var due = di ? di.value : '';
    if (!due) { showToast('Pick a submission deadline', null); return; }
    state.oppInline = null; flushPending();
    oppDecideSubmit(id, due, ps ? ps.value : '').then(fetchAll);
    return;
  }
  if (act === 'opp-pass-go') {
    var root2 = document.querySelector('.opp-row[data-opp="' + cssEsc(id) + '"]');
    var ri = root2 && root2.querySelector('.oc-pass-reason');
    state.oppInline = null; flushPending();
    oppDecidePass(id, ri ? ri.value : '').then(fetchAll);
    return;
  }
}

  var closed = (key in state.closedGroups) ? state.closedGroups[key] : !!opt.collapsed;
  var cap = opt.home ? 6 : 0;

      .then(function () { delete optimistic[id]; ensureAreaBoard(true); fetchAll(); })
      .catch(function () { areaSaveFailed(id); });
  }, function () { delete optimistic[id]; render(); });
}
// "Not for grading" on a kept card: clear kept so the item returns to the normal
// lists. Keeps its teaching placement (John put it there on purpose).
function keptNotGrading(id) {

// "Clear all N" on a course row after grading: mark every kept item in that row done
// through the existing done endpoint, one by one, behind ONE 5-second undo (each
// /api/done writes its own change-log receipt).
function keptClearAll(row) {

    chain.then(function () { ids.forEach(function (id) { delete optimistic[id]; }); ensureAreaBoard(true); fetchAll(); })
      .catch(function () { areaSaveFailed(ids); });
  }, function () { ids.forEach(function (id) { delete optimistic[id]; }); render(); });
}

function classClock(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var hh = d.getHours(), mm = String(d.getMinutes()).padStart(2, '0');
  var ap = hh < 12 ? 'AM' : 'PM'; hh = hh % 12; if (hh === 0) hh = 12;
  return hh + ':' + mm + ' ' + ap;
}
function classDayHeading(ymd) {
  var m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);

  var dt = new Date(+m[1], +m[2] - 1, +m[3]);
  return WD[dt.getDay()] + ' ' + MONTHS[+m[2] - 1] + ' ' + (+m[3]);
}
function classDateLabel(ymd) {
  var m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? (MONTHS[+m[2] - 1] + ' ' + (+m[3])) : (ymd || '');
}

function memoHtml() {
  if (state.memoMissing) return '';           // /api/memo 404 → render nothing
  var m = state.memo;
  if (!m) return '';
  var taskIds = {};
  state.items.forEach(function (i) { if (i.id) taskIds[i.id] = true; });
  function line(obj) {
    var txt = escapeHtml(obj.text || '');
    var clickable = obj.id && taskIds[obj.id];
    return '<p class="mline' + (clickable ? ' clk" data-memo-id="' + escapeHtml(obj.id) : '') + '">' + txt + '</p>';
  }
  var rows = '';
  if (m.main && m.main.text) {
    var hint = m.main.hint ? ' <span>· ' + escapeHtml(m.main.hint) + '</span>' : '';
    var mid = (m.main.id && taskIds[m.main.id]) ? ' data-memo-id="' + escapeHtml(m.main.id) + '"' : '';
    rows += '<div class="memo-row main"><div class="memo-k">Main thing</div>' +
      '<div class="memo-v"><p class="mline' + (mid ? ' clk' : '') + '"' + mid + '>' + escapeHtml(m.main.text) + hint + '</p></div></div>';
  }
  if (Array.isArray(m.dont_drop) && m.dont_drop.length) {
    rows += '<div class="memo-row"><div class="memo-k">Don\'t drop</div><div class="memo-v">' + m.dont_drop.map(line).join('') + '</div></div>';
  }
  if (Array.isArray(m.coming_up) && m.coming_up.length) {
    rows += '<div class="memo-row"><div class="memo-k">Coming up</div><div class="memo-v">' + m.coming_up.map(line).join('') + '</div></div>';
  }
  if (m.heads_up && m.heads_up.text) {
    rows += '<div class="memo-row heads"><div class="memo-k">Heads-up</div><div class="memo-v"><p>' + escapeHtml(m.heads_up.text) + '</p></div></div>';
  }
  if (!rows) return '';
  return '<section class="memo" aria-label="Today\'s memo">' + rows + '</section>';
}

/* ---- capture ---- */
// Drop is the PRIMARY capture (Enter): the system sorts it, you only correct. The
// explicit Task/Read/Garden/Deadline buttons stay for when the kind is already known.
var captureKind = 'drop';
function captureHtml() {
  return '<label class="capture">' +
    '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>' +
    '<input id="cap-input" placeholder="Drop anything — it gets sorted…" aria-label="Capture">' +
    '<span class="kinds" id="cap-kinds">' +
    ['drop', 'task', 'read', 'garden', 'deadline'].map(function (k) {
      var cls = [];
      if (k === 'drop') cls.push('drop');
      if (k === captureKind) cls.push('on');
      return '<button data-kind="' + k + '"' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' + k.charAt(0).toUpperCase() + k.slice(1) + '</button>';
    }).join('') + '</span></label>';
}

function doCapture(kind, text) {
  text = (text || '').trim();
  if (!text) return;
  var isUrl = /^https?:\/\//i.test(text);
  var p, successMsg = 'Captured';
  if (kind === 'drop') {
    // The one capture that decides nothing: the drop router sorts it within ~3 min.
    // Carry the first http(s) url found in the text (the tweet/article link).
    var um = text.match(/https?:\/\/\S+/i);
    successMsg = "Dropped. It'll be sorted in a few minutes.";
    p = apiJson('/api/drop', { method: 'POST', body: { text: text, url: um ? um[0] : '', title: '', page_text: '', source: 'home' } });
  } else if (kind === 'read') {
    if (isUrl) p = apiJson('/api/readlater/add', { method: 'POST', body: { url: text, note: '' } });
    else p = apiJson('/api/capture', { method: 'POST', body: { text: '[read] ' + text, list: 'inbox' } });
  } else if (kind === 'garden') {
    var url = '', body;
    if (isUrl) { var parts = text.split(/\s+/); url = parts[0]; var rest = parts.slice(1).join(' '); body = { text: rest || url, url: url, note: '' }; }
    else body = { text: text, url: '', note: '' };
    p = apiJson('/api/garden/add', { method: 'POST', body: body });
  } else if (kind === 'deadline') {
    p = apiJson('/api/deadlines/add', { method: 'POST', body: { text: text, title: '' } }).then(function (res) {
      if (!res.ok) { // no date found → never lose it: file as an inbox task
        return apiJson('/api/capture', { method: 'POST', body: { text: '[deadline] ' + text, list: 'inbox' } });
      }
      return res;
    });
  } else {
    p = apiJson('/api/capture', { method: 'POST', body: { text: text, list: 'inbox' } });
  }
  p.then(function (res) {
    if (res && (res.ok || res.status === 202 || res.status === 201 || res.status === 200)) {
      var el = document.getElementById('cap-input'); if (el) el.value = '';
      showToast(successMsg, null);
      fetchAll();
    } else {
      showToast('Capture failed — kept your text', null);
    }
  }).catch(function () { showToast('Capture failed — kept your text', null); });
}

/* ---- status pill ---- */
function statusIssues() {
  var out = [];
  // Email looks stuck (2026-11-19) — LOCAL only; reuses the amber status-pill
  // warning style near the top of Today. dbx.js returns 'unknown' hosted, so this
  // never fires on the phone. Listed first so it leads when nothing else is amber.
  if (LOCAL) { var es = emailStuckLine(state.emailHealth, Date.now()); if (es) out.push(es); }
  var h = state.health || {};
  var ov = h.overdue || {};
  Object.keys(ov).forEach(function (a) {
    var mins = ov[a];
    var age = (mins >= 60) ? (Math.round(mins / 60) + 'h') : (mins + 'm');
    out.push((a.charAt(0).toUpperCase() + a.slice(1)) + ' agent silent ' + age);
  });
  if (Array.isArray(h.conflicts) && h.conflicts.length) out.push('Dropbox conflict files: ' + h.conflicts.length);
  if (h.sync && (h.sync.stalled || h.sync.reboot_needed)) out.push(h.sync.reboot_needed ? 'Dropbox sync: reboot needed' : 'Dropbox sync stalled');
  if (h.calendar && h.calendar.degraded) out.push('Calendar coverage partial');
  // Nightly lint (2026-11): a warn-level anomaly (a vanished record, a conflict
  // fork, a torn log) belongs on the status pill — it changes what the ledger can
  // be trusted to say. Info-level lint never surfaces here.
  if (h.lint && h.lint.warn) {
    out.push(h.lint.warn + ' anomaly' + (h.lint.warn > 1 ? 'ies' : 'y') + ' to review (Sweeps, System changes)');
  }
  if (state.memo && state.memo.heads_up && state.memo.heads_up.kind === 'email_stale') {
    out.push(state.memo.heads_up.text || 'Work email not synced recently');
  }
  return out;
}
function renderStatus() {
  var issues = statusIssues();
  var el = document.getElementById('status');
  if (!issues.length) { el.style.display = 'none'; el.classList.remove('open'); return; }
  el.style.display = '';
  document.getElementById('status-label').textContent = issues.length === 1 ? issues[0] : (issues.length + ' things need attention');
  document.getElementById('status-detail').innerHTML = '<ul>' + issues.map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join('') + '</ul>';
}

function canAutoRefresh() {
  if (state.openRow) return false;
  if (state.sweepQueue) return false;   // never rebuild a queue snapshot mid-sweep
  if (state.block && state.block.running) return false;  // never interrupt a timer
  if (state.blockPanel) return false;   // a half-filled start-a-block form
  var a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return false;
  if (_pending) return false;
  return true;
}

  // title Enter/Space → toggle
  if (e.target && e.target.classList && e.target.classList.contains('t') && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); var r2 = e.target.closest('.row'); if (r2) { var id = r2.getAttribute('data-id'); state.openRow = (state.openRow === id) ? null : id; render(); }
  }
});

// Search inputs (Library someday shelf, Kitchen): re-render on input, then
// restore focus + caret (innerHTML replacement recreates the field).
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t && t.id === 'lib-search') { state.libSearch = t.value; rerenderKeepFocus('lib-search'); }
  else if (t && t.id === 'kitchen-search') { state.kitchenSearch = t.value; rerenderKeepFocus('kitchen-search'); }
  // Schedule form fields: update state WITHOUT re-rendering (so focus/caret stay put
  // across the fields); just toggle the Add button in place as Day/Time fill in. The
  // card and the sort box share one form markup; state.cardScheduleId tells which
  // buffer the keystroke belongs to (they are never both open).
  else if (t && t.classList && t.classList.contains('esch-in')) {
    var buf = state.cardScheduleId
      ? (state.cardScheduleForm = state.cardScheduleForm || {})
      : (state.emailScheduleForm = state.emailScheduleForm || {});
    buf[t.getAttribute('data-f')] = t.value;
    var add = document.getElementById('esch-add');
    if (add) add.disabled = !scheduleCanAdd(buf.day, buf.time);
  }
  // "Reword" / "Make it a task" form fields: update state WITHOUT re-render (keep
  // focus/caret), so a re-render rebuilds the typed values via makeTaskFormView.
  else if (t && t.classList && t.classList.contains('mt-in')) {
    state.makeTaskForm = state.makeTaskForm || {};
    state.makeTaskForm[t.getAttribute('data-f')] = t.value;
  }
  // "Add something to do" line: the text + native day input update state without a
  // re-render; the Project select re-renders the one row it affects.
  else if (t && t.id === 'addt-in') { state.addTaskText = t.value; }
  else if (t && t.classList && t.classList.contains('addt-day')) { state.addTaskDay = t.value; }
  else if (t && t.classList && t.classList.contains('addt-projsel')) { addTaskSetProject(t.value); }
});
function rerenderKeepFocus(id) {
  render();
  var el = document.getElementById(id);
  if (el) { el.focus(); try { var v = el.value.length; el.setSelectionRange(v, v); } catch (e) {} }
}

document.getElementById('toast-undo').addEventListener('click', function () {
  var t = document.getElementById('toast'); if (t._undo) t._undo();
});
document.getElementById('status-btn').addEventListener('click', function () {
  document.getElementById('status').classList.toggle('open');
});
document.getElementById('server-retry').addEventListener('click', fetchAll);

function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

/* ===== lens + routing ===== */
function setLens(lens) {
  if (!['work', 'life', 'all'].includes(lens)) return;
  state.lens = lens;
  try { localStorage.setItem('triage-home-lens', lens); } catch (e) {}
  state.openRow = null;
  render();
}
function defaultLens() {
  try { var saved = localStorage.getItem('triage-home-lens'); if (saved) return saved; } catch (e) {}
  var d = new Date().getDay();
  return (d === 0 || d === 6) ? 'all' : 'work';
}
function applyHash() {
  var h = (location.hash || '').replace('#', '');
  if (h === 'areas') h = 'projects';   // legacy #areas still resolves; #projects is canonical
  var views = ['tasks', 'sweeps', 'projects', 'library', 'kitchen', 'work'];   // Work is dual-mode (hosted board via dbx.js)
  if (LOCAL) views.push('class-notes');   // FERPA: Class notes is LOCAL-only, never reachable on the hosted shell
  state.view = views.indexOf(h) >= 0 ? h : 'home';
  state.openRow = null;
  if (state.view === 'kitchen') ensureRecipes();
  if (state.view === 'class-notes') ensureClassNotes();
  if (state.view === 'work') { state.areaOpen = readRememberedAreaTab(); ensureAreaBoard(); }
  // The Today (home) page's email sort box reads the same board (dual-mode).
  if (state.view === 'home') ensureAreaBoard();
  if (state.view !== 'sweeps') {
    // leaving the Sweeps area: close any open queue and sync counts if changed.
    state.sweepQueue = null; state.sweepPick = null;
    if (state.sweepDirty) { state.sweepDirty = false; fetchAll(); return; }
  } else {
    state.sweepReceiptLine = state.sweepReceiptLine || '';
  }
  render();
}
window.addEventListener('hashchange', applyHash);

// refresh on focus (throttled, suppressed while editing/expanded)
document.addEventListener('visibilitychange', function () { if (!document.hidden) maybeRefresh(); });
window.addEventListener('focus', maybeRefresh);
function maybeRefresh() { if (Date.now() - state.lastFetch < 4000) return; if (!canAutoRefresh()) return; fetchAll(); }

/* ===== boot ===== */
state.lens = defaultLens();
// FERPA: the Class notes page is LOCAL only (it can name students). Remove its nav
// entries entirely on the hosted shell so the phone never links to it. The Work nav
// STAYS hosted (the board is dual-mode via dbx.js); only `.cn-nav` is removed.
if (!LOCAL) { try { document.querySelectorAll('.cn-nav').forEach(function (el) { el.parentNode.removeChild(el); }); } catch (e) {} }
applyHash();        // sets view + paints an empty shell immediately
if (LOCAL) {
  fetchAll();
  // Prime the course registry (for the Today "Keep for grading" course picker);
  // applyHash already triggered a full load if the Class notes view is open.
  if (state.view !== 'class-notes') ensureClassNotes();
} else {
  // Hosted: show the connect-gate at once, then wait for dbx.js to finish any
  // OAuth redirect (?code=) exchange before the first fetch, so a just-connected
  // device doesn't fire token() before the refresh token lands.
  renderConnectGate();
  var _ready = (typeof DBX !== 'undefined' && DBX.ready) ? DBX.ready : Promise.resolve();
  Promise.resolve(_ready).catch(function () {}).then(function () { renderConnectGate(); fetchAll(); });
}
</script>
